name: TI production controller
# 03AA-04_Production_Controller_TI (docs/TI_PRODUCTION_CONTROLLER.md). Detects delayed, missed and failed
# production work, checks data.json and the public release, keeps deduplicated tasks on TI_PC_STATE_BRANCH.
# Operating mode comes from config/production_controller.json (Marc's confirmed setting: observe); the
# repository variable TI_PC_MODE overrides it, and TI_PC_MODE=off stops every run. No model call, no spend,
# never writes main or data.json.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_run:
    # Check straight after the refresh and the baseline build, without waiting for the hourly slot.
    workflows: ["Daily travel intelligence data refresh", "TI baseline intelligence build"]
    types: [completed]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ti-production-controller
  cancel-in-progress: false

jobs:
  check:
    if: vars.TI_PC_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the state branch only (TI_PC_STATE_BRANCH, never main); unused in observe mode
      actions: read
      pages: read
    outputs:
      dispatches: ${{ steps.pc.outputs.dispatches }}
      verdict: ${{ steps.pc.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      # Optional Agent Command Centre report (docs/ACC_REPORTING.md). Skipped unless ACC_REPORTING_ENABLED is "true";
      # continue-on-error and a 1-minute limit mean it can never change this run's result.
      - name: ACC report (start)
        if: vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          ACC_REPORT_URL: ${{ vars.ACC_REPORT_URL }}
          ACC_KEY_ID: ${{ vars.ACC_KEY_ID_PRODUCTION_CONTROLLER }}
          ACC_AGENT_SECRET: ${{ secrets.ACC_AGENT_SECRET_PRODUCTION_CONTROLLER }}
          ACC_EUR_PER_USD: ${{ vars.ACC_EUR_PER_USD }}
          ACC_EUR_RATE_DATE: ${{ vars.ACC_EUR_RATE_DATE }}
        run: python3 scripts/acc_report.py start --agent 03AA-04_Production_Controller_TI --pending-file "$RUNNER_TEMP/acc_pending_start.json"
      - id: pc
        name: Production checks
        env:
          TI_AGENT_OUTCOME_FILE: ${{ vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request' && format('{0}/agent_outcome.json', runner.temp) || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TI_PC_EVENT: ${{ github.event_name }}
          TI_PC_MODE: ${{ vars.TI_PC_MODE }}
          TI_PC_STATE_BRANCH: ${{ vars.TI_PC_STATE_BRANCH }}
          TI_PC_SITE_URL: ${{ vars.TI_PC_SITE_URL }}
          TI_PC_RECOVERY_WORKFLOWS: ${{ vars.TI_PC_RECOVERY_WORKFLOWS }}
          TI_PC_MAX_DISPATCHES_PER_DAY: ${{ vars.TI_PC_MAX_DISPATCHES_PER_DAY }}
        # Exit 1: a new or escalated critical exception (active mode). 3: configuration. 4: state not persisted.
        run: python3 scripts/ops_director.py production-check
      - name: ACC outbox (restore)
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/acc_outbox
          key: acc-outbox-production-controller-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: acc-outbox-production-controller-
      - name: ACC report (end)
        id: acc_end
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          ACC_REPORT_URL: ${{ vars.ACC_REPORT_URL }}
          ACC_KEY_ID: ${{ vars.ACC_KEY_ID_PRODUCTION_CONTROLLER }}
          ACC_AGENT_SECRET: ${{ secrets.ACC_AGENT_SECRET_PRODUCTION_CONTROLLER }}
          ACC_EUR_PER_USD: ${{ vars.ACC_EUR_PER_USD }}
          ACC_EUR_RATE_DATE: ${{ vars.ACC_EUR_RATE_DATE }}
        run: python3 scripts/acc_report.py end --agent 03AA-04_Production_Controller_TI --outcome-file "$RUNNER_TEMP/agent_outcome.json" --step-outcome "${{ steps.pc.outcome }}" --outbox-file "$RUNNER_TEMP/acc_outbox/outbox.json" --pending-file "$RUNNER_TEMP/acc_pending_start.json"
      - name: ACC outbox (save)
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request' && steps.acc_end.outputs.outbox_save == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/acc_outbox
          key: acc-outbox-production-controller-${{ github.run_id }}-${{ github.run_attempt }}

  recover:
    # Bounded recovery. Runs only for workflows Marc listed in TI_PC_RECOVERY_WORKFLOWS; each dispatch was
    # recorded on the state branch (counted against the daily cap) before this job starts.
    needs: check
    if: always() && needs.check.outputs.dispatches != '' && needs.check.outputs.dispatches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Dispatch recovery runs
        # Parsing and the allow-list re-check are in tested Python (production.dispatch_commands).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TI_PC_DISPATCHES: ${{ needs.check.outputs.dispatches }}
          TI_PC_RECOVERY_WORKFLOWS: ${{ vars.TI_PC_RECOVERY_WORKFLOWS }}
        run: python3 scripts/ops_director.py production-dispatch
