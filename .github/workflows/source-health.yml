name: TI Source Health

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate source registry
        run: python3 scripts/validate_ti_sources.py

      - name: Check Tier 1-3 source connectivity
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python3 scripts/check_source_connectivity.py

      - name: Validate TI data model
        run: python3 scripts/validate_ti_data.py
