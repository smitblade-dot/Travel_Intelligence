name: Refresh schedule regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/daily-data-refresh.yml'
      - '.github/workflows/refresh-schedule-tests.yml'
      - 'tests/test_refresh_schedule.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  schedule-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p test_refresh_schedule.py -v
