name: TI country intelligence builder
# 03AA-04_Country_Intelligence_Builder_TI (docs/TI_COUNTRY_INTELLIGENCE_BUILDER.md).
# Finds a missing or stale country/category, collects permitted evidence, applies the TI publication rules and, on a
# scheduled or manual run on main, publishes what passes through a compare-and-swap commit to main, then verifies that
# the public site serves it (rolling back if it does not). Anything that fails a rule is held with its reason and routed
# through the Master Agent. Drafts, the ledger and the report live on TI_CB_STATE_BRANCH (default ti-country-drafts).
# Operating mode comes from config/country_builder.json; the repository variable TI_CB_MODE overrides it, TI_CB_PUBLISH=false
# switches publication off, and TI_CB_MODE=off (or disabling this workflow) stops every run.
# Paid model use needs TI_CB_DRY_RUN=false AND all three spending limits AND ANTHROPIC_API_KEY. The ordinary-code
# extractive path needs none of them. Pull requests get no model key and cannot publish: the code refuses to write main
# unless the event is a schedule or a manual dispatch and the ref is refs/heads/main.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/ti_ops_director/country_*.py"
      - "scripts/country_builder.py"
      - "config/country_builder.json"
      - ".github/workflows/country-intelligence-builder.yml"

permissions: {}

concurrency:
  group: ti-country-intelligence-builder
  cancel-in-progress: false

jobs:
  build:
    if: vars.TI_CB_MODE != 'off' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # main (publication, compare-and-swap) and the drafts branch; the code refuses to write main on a pull request
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF text reader
        run: python -m pip install pypdf==6.17.0
      - name: Configure git identity
        run: |
          git config --global user.name "Travel Intelligence Bot"
          git config --global user.email "actions@users.noreply.github.com"
      # Optional Agent Command Centre report (docs/ACC_REPORTING.md). Skipped unless ACC_REPORTING_ENABLED is "true";
      # continue-on-error and a 1-minute limit mean it can never change this run's result.
      - name: ACC report (start)
        if: vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          ACC_REPORT_URL: ${{ vars.ACC_REPORT_URL }}
          ACC_KEY_ID: ${{ vars.ACC_KEY_ID_COUNTRY_BUILDER }}
          ACC_AGENT_SECRET: ${{ secrets.ACC_AGENT_SECRET_COUNTRY_BUILDER }}
          ACC_EUR_PER_USD: ${{ vars.ACC_EUR_PER_USD }}
          ACC_EUR_RATE_DATE: ${{ vars.ACC_EUR_RATE_DATE }}
        run: python3 scripts/acc_report.py start --agent 03AA-04_Country_Intelligence_Builder_TI --pending-file "$RUNNER_TEMP/acc_pending_start.json"
      - name: Country builder pass
        id: cb
        env:
          TI_AGENT_OUTCOME_FILE: ${{ vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request' && format('{0}/agent_outcome.json', runner.temp) || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No model key on pull requests (an empty string is falsy, so guard with != rather than an empty-string fallback).
          ANTHROPIC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY || '' }}
          # The pull-request trial assesses real evidence against the rules and reports what would publish; it cannot publish.
          TI_CB_MODE: ${{ github.event_name == 'pull_request' && 'draft' || vars.TI_CB_MODE }}
          TI_CB_PUBLISH: ${{ vars.TI_CB_PUBLISH }}
          TI_CB_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || vars.TI_CB_DRY_RUN }}
          # Pull-request trials keep their own ledger branch so they never write into the production ledger.
          TI_CB_STATE_BRANCH: ${{ github.event_name == 'pull_request' && 'ti-country-drafts-trial' || vars.TI_CB_STATE_BRANCH }}
          TI_CB_COUNTRIES: ${{ vars.TI_CB_COUNTRIES }}
          TI_CB_CATEGORIES: ${{ vars.TI_CB_CATEGORIES }}
          TI_CB_BATCH_SIZE: ${{ vars.TI_CB_BATCH_SIZE }}
          TI_CB_PER_TASK_LIMIT_USD: ${{ vars.TI_CB_PER_TASK_LIMIT_USD }}
          TI_CB_DAILY_LIMIT_USD: ${{ vars.TI_CB_DAILY_LIMIT_USD }}
          TI_CB_MONTHLY_LIMIT_USD: ${{ vars.TI_CB_MONTHLY_LIMIT_USD }}
        # Exit 3: configuration error. 4: state could not be persisted. 5: a publication needs attention (push/validation refused, content demonstrably incorrect, rollback failed, or verification unresolved after bounded rechecks). A merely pending deployment and held exceptions exit 0.
        run: python3 scripts/country_builder.py run
      - name: ACC outbox (restore)
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/acc_outbox
          key: acc-outbox-country-builder-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: acc-outbox-country-builder-
      - name: ACC report (end)
        id: acc_end
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          ACC_REPORT_URL: ${{ vars.ACC_REPORT_URL }}
          ACC_KEY_ID: ${{ vars.ACC_KEY_ID_COUNTRY_BUILDER }}
          ACC_AGENT_SECRET: ${{ secrets.ACC_AGENT_SECRET_COUNTRY_BUILDER }}
          ACC_EUR_PER_USD: ${{ vars.ACC_EUR_PER_USD }}
          ACC_EUR_RATE_DATE: ${{ vars.ACC_EUR_RATE_DATE }}
        run: python3 scripts/acc_report.py end --agent 03AA-04_Country_Intelligence_Builder_TI --outcome-file "$RUNNER_TEMP/agent_outcome.json" --step-outcome "${{ steps.cb.outcome }}" --outbox-file "$RUNNER_TEMP/acc_outbox/outbox.json" --pending-file "$RUNNER_TEMP/acc_pending_start.json"
      - name: ACC outbox (save)
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request' && steps.acc_end.outputs.outbox_save == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/acc_outbox
          key: acc-outbox-country-builder-${{ github.run_id }}-${{ github.run_attempt }}
