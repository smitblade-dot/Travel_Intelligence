name: Daily travel intelligence data refresh

run-name: "Daily travel intelligence data refresh${{ github.event_name == 'schedule' && format(' [{0}]', github.event.schedule) || '' }}"

on:
  schedule:
    # 21:00 Europe/Nicosia year-round: 18:00 UTC in summer (EEST), 19:00 UTC
    # in winter (EET). GitHub's `timezone:` key fired at 21:00 UTC instead
    # (20-21 Oct 2026), so both UTC hours are scheduled and the gate keeps the
    # one that is 21:00 in Cyprus. Queue delay must never decide the outcome.
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: scripts/ti_ops_director/refresh_slot.py
          sparse-checkout-cone-mode: false

      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        # Decides from the cron entry that fired; the clock only selects which
        # day's instance of that entry this is, so any delay under 24 h is inert.
        run: |
          GATE_NOW_EPOCH="$(date -u +%s)" python3 scripts/ti_ops_director/refresh_slot.py

  refresh:
    needs: schedule_gate
    if: needs.schedule_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config --global user.name "Travel Intelligence Bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Collect Phase 1 open-data signals
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
        run: python3 scripts/collect_phase1_signals.py

      - name: Resolve signals to TI review queue
        run: python3 scripts/resolve_phase1_signals.py

      - name: Build infrastructure relationship graph
        run: python3 scripts/build_infrastructure_graph.py

      - name: Build transport reference network
        # Preserve independent verification if no reference can be fetched.
        # The final strict feed audit still fails on empty/stale airport data.
        continue-on-error: true
        run: python3 scripts/build_transport_network.py

      - name: Refresh oil & gas summary (deterministic)
        run: python3 scripts/refresh_oilgas.py

      - name: Prepare review completion contract
        id: review_contract
        run: python3 scripts/refresh_review.py prepare >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: intelligence_review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: >
            Run the normal Travel Intelligence daily refresh from CLAUDE.md.
            This is a one-shot production job: complete research, synthesis and
            all data edits before your final response. Use only the available
            tools directly; do not delegate, spawn agents or start background
            work. Never finish with a promise to continue or wait for agents.
            Return the required structured review report with runId
            ${{ github.run_id }}, pendingTasks 0 and status COMPLETE only after
            actually reviewing every tracked country and both continuing Hot
            Topics. countryReviews must include each data.json country.id
            exactly once. Read ${{ runner.temp }}/ti-refresh-input.json for the
            exact country and active Hot Topic IDs required. Each review needs
            the actual sourceUrls checked, an outcome and a concise note.
            If a review cannot be completed, report INCOMPLETE and unverified;
            never manufacture evidence or mark a country reviewed merely
            because a discovery signal or old record exists.

            Use existing registered reputable news sources and current official,
            host-country and local-language sources for discovery and review.
            Search for current reporting directly rather than depending on
            GDELT results. GDELT is supplementary: use its collected evidence
            when available, but do not call GDELT again or retry it with Bash,
            WebFetch or another tool. Its absence does not establish no news
            or no change. Record actual sources checked for every review;
            if alternative sources cannot establish coverage, report unverified.

            Treat the country records as a live intelligence layer as well as
            Current Intelligence events. Inspect all tracked countries for
            material, currently verified changes to traveller-relevant
            requirements, warnings, procedures and other country guidance.
            Update existing records or create new records where the primary
            source supports a real change, with the required
            SourceObservation. Do not invent coverage or backfill empty
            categories merely to make countries look populated.
            Phase 1 open-data signals are in data/phase1_signals.json, the
            deterministic review queue is in data/phase1_review_queue.json,
            infrastructure relationships are in
            data/infrastructure_graph.json, and the conservative transport
            reference network is in data/transport_network.json. Use these as
            discovery/reference material only. Verify important claims against
            the actual primary source before creating or updating any public
            TI event. Do not invent affected infrastructure or routes from a
            country-level association alone. Prefer explicit verified
            relationships; otherwise leave the relationship unresolved. Do
            not invent events from signals alone. Preserve source provenance
            and uncertainty. The oilGasSummary section was refreshed
            separately; do not touch or re-derive it. Make substantive TI changes
            and leave them uncommitted; do not push during this step. Leave publication to the validated safety-net step. Review security redeployments, alleged plots, tanker casualties and coastal restrictions as well as transport closures. Retain unresolved geographic leads for review. Review continuing Hot Topics explicitly, including Fairford and Sochi; event age alone is not grounds for deletion. Allegations require review and must not be promoted to confirmed attribution.
          claude_args: |
            --model claude-sonnet-5
            --tools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
            --json-schema '${{ steps.review_contract.outputs.schema }}'
            --max-turns 120

      - name: Preserve unapproved candidate for recovery
        if: always()
        run: cp data.json "$RUNNER_TEMP/ti-refresh-candidate.json"

      - name: Verify intelligence review completed
        if: always()
        env:
          REVIEW_OUTPUT: ${{ steps.intelligence_review.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.intelligence_review.outputs.execution_file }}
        run: python3 scripts/refresh_review.py

      - name: Build traveller impact graph
        run: python3 scripts/build_traveller_impact_graph.py

      - name: Synchronise public intelligence metadata
        run: |
          python3 - << 'PYEOF'
          import json, datetime
          from pathlib import Path
          p = Path("data.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          published = [e for e in d["events"] if e.get("publicationStatus") == "PUBLISHED"]
          published_ids = {e.get("id") for e in published}
          published_obs = [o for o in d["sourceObservations"] if o.get("eventId") in published_ids]
          d["meta"]["counts"].update({
              "countries": len(d["countries"]),
              "records": len(d["records"]),
              "sources": len(d["sources"]),
              "locations": len(d["locations"]),
              "events": len(d["events"]),
              "sourceObservations": len(d["sourceObservations"]),
          })
          d["meta"]["currentIntelligence"] = {
              "events": len(published),
              "sourceObservations": len(published_obs),
          }
          d["meta"]["generated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          p.write_text(json.dumps(d, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          print(f"Metadata synced: published events={len(published)}, published observations={len(published_obs)}")
          PYEOF

      - name: Validate TI data model
        run: python3 scripts/validate_ti_data.py

      - name: Audit Phase 1 foundation
        run: python3 scripts/audit_phase1_foundation.py

      - name: Safety-net commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Automated data refresh (safety-net commit) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Claude Code may commit/push during the refresh. Rebase the
            # safety-net commit onto the current remote main before pushing,
            # so a concurrent Claude commit or another main commit cannot
            # cause a non-fast-forward failure.
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nothing outstanding — refresh step already committed."
          fi

      # Run after the validated update is saved: outages must be visible without
      # suppressing independently verified intelligence from working sources.
      - name: Audit discovery feed health
        if: always()
        run: python3 scripts/audit_feed_health.py

      - name: Retain refresh diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/phase1_signals.json
            data/transport_network.json
            ${{ runner.temp }}/ti-refresh-review.json
            ${{ runner.temp }}/ti-refresh-input.json
            ${{ runner.temp }}/ti-refresh-candidate.json
          retention-days: 7
          if-no-files-found: warn
