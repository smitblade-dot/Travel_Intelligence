name: Daily travel intelligence data refresh

on:
  schedule:
    # Daily, 21:00 Cyprus time (changed from weekly to daily 2026-09-22).
    # Cyprus is UTC+3 (EEST) while daylight saving is in effect, so 21:00
    # Cyprus = 18:00 UTC. GitHub evaluates cron in UTC. Cyprus drops out
    # of daylight saving in late October (to UTC+2/EET) — from then,
    # 21:00 Cyprus time is 19:00 UTC, so this line would need to become
    # "0 19 * * *" to stay at 21:00 local. It isn't auto-adjusted.
    - cron: "0 18 * * *"
  workflow_dispatch: {} # lets you also trigger a run manually from the Actions tab

permissions:
  contents: write   # Claude needs to commit + push the updated data.json
  id-token: write    # required for the Claude GitHub App's default authentication

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config --global user.name "Forged Titanium Bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Refresh oil & gas summary (deterministic — no AI, no dashboards pushed here)
        run: python3 scripts/refresh_oilgas.py

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: >
            The oilGasSummary section of data.json has already been
            refreshed by a separate, deterministic script that just ran —
            do not touch it, and don't re-derive or second-guess it.
            Follow the rest of the daily data refresh procedure in
            CLAUDE.md exactly, start to finish, including step 0 (checking
            the two sibling oil & gas dashboards for fresh signal) and
            committing and pushing the updated data.json yourself (your
            commit will naturally include the oil & gas script's changes
            too, since they're already sitting in the working tree —
            that's expected). This is an unattended scheduled run.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
            --max-turns 60

      - name: Ensure meta.generated reflects this run
        # Deterministic, not AI-driven: guarantees the "data as of" timestamp
        # on the site always advances every day, regardless of whether the
        # Claude step above judged any source content worth changing. The
        # Claude step is still responsible for the substantive source checks
        # and any real record edits; this step only guarantees the timestamp.
        run: |
          python3 - << 'PYEOF'
          import re, datetime
          path = "data.json"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          new_text, n = re.subn(r'"generated":"[^"]*"', f'"generated":"{now}"', text, count=1)
          if n != 1:
              raise SystemExit(f"Expected exactly one meta.generated field, found {n}")
          with open(path, "w", encoding="utf-8") as f:
              f.write(new_text)
          print(f"meta.generated set to {now}")
          PYEOF

      - name: Safety-net commit and push
        # Belt-and-braces: if the step above didn't end up committing (a
        # transient API error, an unexpected early stop, etc.), make sure
        # today's oil & gas refresh — and anything else already staged
        # in the working tree — still reaches GitHub. Nothing to do here
        # most days, since the Claude step above already pushes.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Automated data refresh (safety-net commit) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Nothing outstanding — the refresh step already
