name: TI Independent Claude QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: >
            Perform an independent QA review of this Travel Intelligence pull
            request. Review the actual diff against main and the repository's
            CLAUDE.md rules. Do not modify files, commit, push, or merge.
            Challenge the implementation rather than assuming it is correct.
            Check functional correctness, regression risk, data integrity,
            source provenance, Current Intelligence publication controls,
            source-tier correctness, workflow safety, accessibility including
            red-green colour-blind usability, legal/compliance implications,
            mobile/UI behaviour, and unintended changes. Confirm that the
            consolidation preserves the newer main data and adds the intended
            source-registry/government-advisory functionality. Report exactly:
            PASS, PASS WITH ISSUES, or FAIL, followed by each issue with
            severity, file, location, problem and recommended correction.
            If no issues are found, state that explicitly. This is a review
            only; do not make changes.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Glob,Grep"
            --max-turns 60
