name: TI Ops Director tests
on:
  pull_request:
    paths:
      - "scripts/ti_ops_director/**"
      - "scripts/ops_director.py"
      - "tests/test_ti_ops_director*.py"
      - "tests/ops_support.py"
      - "tests/fixtures/ops_director/**"
      - "config/ops_director.example.json"
      - "config/ops_director_pricing.json"
      - "config/production_controller.json"
      - ".github/workflows/production-controller.yml"
      - "deploy/ops_director/**"
      - "scripts/continuous_intelligence_monitor.py"
      - "scripts/country_builder.py"
      - "scripts/audit_baseline_coverage.py"
      - "config/country_builder.json"
      - "tests/country_support.py"
      - "tests/fixtures/country_builder/**"
      - ".github/workflows/country-intelligence-builder.yml"
      - ".github/workflows/ops-director-tests.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Offline tests (no network provider, no API cost)
        run: |
          python -m compileall -q scripts/ti_ops_director scripts/ops_director.py
          python -m unittest discover -s tests -p 'test_ti_ops_director*.py' -v
      - name: Fixture demonstration
        run: TI_OPS_DB_PATH="$RUNNER_TEMP/ops.sqlite3" python scripts/ops_director.py demo --mode fixture
      - name: Live feed-health diagnostic (read-only probes, dry-run, no API key)
        # Measured evidence for the operational report. Provider outages must not fail the PR.
        continue-on-error: true
        run: |
          TI_OPS_DB_PATH="$RUNNER_TEMP/live.sqlite3" python scripts/ops_director.py run-once --mode live | tee "$RUNNER_TEMP/live.md"
          cat "$RUNNER_TEMP/live.md" >> "$GITHUB_STEP_SUMMARY"
  production-observe:
    # 03AA-04_Production_Controller_TI against real production, read-only: this PR's code, main's outputs.
    # observe mode writes no state and dispatches nothing. Exceptions it finds must not fail the PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check out main's outputs beside the PR code
        run: |
          git fetch --depth=1 origin main
          git worktree add "$RUNNER_TEMP/main" FETCH_HEAD
      - name: Live production observation (no writes, no dispatch, no API cost)
        # Same-repository PRs only: PR code never receives a token on a fork PR.
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TI_PC_MODE: observe
        run: python3 scripts/ops_director.py production-check --data-root "$RUNNER_TEMP/main"
  docker-image:
    # Builds the NUC image and runs it with the compose hardening (read-only root, no capabilities).
    # No secrets, no paid call: fixture mode and dry-run only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -f deploy/ops_director/Dockerfile -t ti-ops-director:ci .
      - name: Smoke test (fixture mode, dry-run)
        run: |
          docker volume create ti_ops_ci
          run="docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges -v ti_ops_ci:/data -v $PWD:/repo:ro ti-ops-director:ci"
          $run init
          $run run-once --mode fixture | tee report.md
          grep -q "Mode: DRY-RUN" report.md
          $run status | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['task_counts']['completed'] >= 1, d['task_counts']"
