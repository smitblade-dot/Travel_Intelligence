name: Continuous intelligence monitoring (Haiku)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Prevent simultaneous monitor writers; the 21:00 consolidation remains separate.
concurrency:
  group: ti-continuous-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      # Optional Agent Command Centre report (docs/ACC_REPORTING.md). Skipped unless ACC_REPORTING_ENABLED is "true";
      # continue-on-error and a 1-minute limit mean it can never change this run's result.
      - name: ACC report (start)
        if: vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          ACC_REPORT_URL: ${{ vars.ACC_REPORT_URL }}
          ACC_KEY_ID: ${{ vars.ACC_KEY_ID_MASTER }}
          ACC_AGENT_SECRET: ${{ secrets.ACC_AGENT_SECRET_MASTER }}
          ACC_EUR_PER_USD: ${{ vars.ACC_EUR_PER_USD }}
          ACC_EUR_RATE_DATE: ${{ vars.ACC_EUR_RATE_DATE }}
        run: python3 scripts/acc_report.py start --agent 03AA-04_Master_Agent_TI_Ops_Director --pending-file "$RUNNER_TEMP/acc_pending_start.json"
      - name: Run discovery and Haiku triage
        id: monitor
        env:
          TI_AGENT_OUTCOME_FILE: ${{ vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request' && format('{0}/agent_outcome.json', runner.temp) || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TI_HAIKU_MODEL: ${{ vars.TI_HAIKU_MODEL }}
          # Publication fails closed: only the exact value "true" publishes; unset/empty/other = off.
          TI_MONITOR_PUBLISH: ${{ vars.TI_MONITOR_PUBLISH }}
          TI_MONITOR_FEEDS: ${{ vars.TI_MONITOR_FEEDS }}
          # Spending gateway (docs/TI_OPS_DIRECTOR.md, "Production transition"). Paid triage stays OFF until
          # TI_OPS_DRY_RUN=false and all three USD limits are set to positive numbers.
          TI_OPS_DRY_RUN: ${{ vars.TI_OPS_DRY_RUN }}
          TI_OPS_PER_TASK_LIMIT_USD: ${{ vars.TI_OPS_PER_TASK_LIMIT_USD }}
          TI_OPS_DAILY_LIMIT_USD: ${{ vars.TI_OPS_DAILY_LIMIT_USD }}
          TI_OPS_MONTHLY_LIMIT_USD: ${{ vars.TI_OPS_MONTHLY_LIMIT_USD }}
          TI_OPS_MAX_MODEL_CALLS_PER_TASK: ${{ vars.TI_OPS_MAX_MODEL_CALLS_PER_TASK }}
          # Spend reservations, budgets, cursor and result cache are compare-and-swap commits to main,
          # so limits hold across runs, re-runs and concurrent runs. The monitor pushes its own state.
          TI_MONITOR_STATE_BACKEND: git
        # Exit 0: run executed (triage may still be NOT COMPLETED: read the job summary).
        # Exit 3: configuration defect (no paid call). Exit 4: state not persisted or triage stalled.
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing ANTHROPIC_API_KEY. Monitoring cannot run."
            exit 1
          fi
          python3 scripts/continuous_intelligence_monitor.py
      - name: ACC outbox (restore)
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/acc_outbox
          key: acc-outbox-master-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: acc-outbox-master-
      - name: ACC report (end)
        id: acc_end
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        env:
          ACC_REPORT_URL: ${{ vars.ACC_REPORT_URL }}
          ACC_KEY_ID: ${{ vars.ACC_KEY_ID_MASTER }}
          ACC_AGENT_SECRET: ${{ secrets.ACC_AGENT_SECRET_MASTER }}
          ACC_EUR_PER_USD: ${{ vars.ACC_EUR_PER_USD }}
          ACC_EUR_RATE_DATE: ${{ vars.ACC_EUR_RATE_DATE }}
        run: python3 scripts/acc_report.py end --agent 03AA-04_Master_Agent_TI_Ops_Director --outcome-file "$RUNNER_TEMP/agent_outcome.json" --step-outcome "${{ steps.monitor.outcome }}" --outbox-file "$RUNNER_TEMP/acc_outbox/outbox.json" --pending-file "$RUNNER_TEMP/acc_pending_start.json"
      - name: ACC outbox (save)
        if: always() && vars.ACC_REPORTING_ENABLED == 'true' && github.event_name != 'pull_request' && steps.acc_end.outputs.outbox_save == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/acc_outbox
          key: acc-outbox-master-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Re-validate canonical intelligence data as pushed
        if: always()
        run: python3 scripts/validate_ti_data.py
