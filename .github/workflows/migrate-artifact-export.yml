name: TI Artifact Migration

on:
  workflow_dispatch:
  push:
    branches: [ti-migration-2026-09]
    paths:
      - ".github/workflows/migrate-artifact-export.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ti-migration-2026-09

      - name: Verify exact Artifact export
        run: |
          test -f ti_full_export.json
          python3 - <<'PY'
          import json
          p="ti_full_export.json"
          d=json.load(open(p,encoding="utf-8"))
          expected={"countries":52,"records":360,"sources":123,"locations":14,"events":6,"sourceObservations":6}
          actual={k:len(d.get(k,[])) for k in expected}
          print("Artifact export counts:", actual)
          assert actual == expected, (actual, expected)
          print("Artifact export verification passed")
          PY

      - name: Merge Artifact data
        run: python3 scripts/merge_artifact_export.py ti_full_export.json data.json

      - name: Validate merged dataset
        run: python3 scripts/validate_ti_data.py data.json

      - name: Show migration diff summary
        run: |
          git status --short
          git diff --stat -- data.json
          python3 - <<'PY'
          import json
          d=json.load(open("data.json",encoding="utf-8"))
          print("Final counts:", {k:len(d[k]) for k in ["countries","records","sources","locations","events","sourceObservations"]})
          PY

      - name: Commit merged data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Migrate exact Artifact current-intelligence data" || echo "No data changes to commit"
          git push origin HEAD:ti-migration-2026-09
