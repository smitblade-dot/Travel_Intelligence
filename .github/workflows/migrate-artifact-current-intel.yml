          ]

          # Add only the two Artifact sources required by the six observations.
          existing_sources = data.setdefault("sources", {})
          for sid, source in sources.items():
              if sid in existing_sources:
                  if existing_sources[sid] != source:
                      raise SystemExit(f"Source {sid} already exists but does not exactly match Artifact export")
              else:
                  existing_sources[sid] = source

          existing_events = data.setdefault("events", [])
          existing_obs = data.setdefault("sourceObservations", [])

          def merge_exact(collection, payload, name):
              by_id = {x["id"]: x for x in collection}
              for item in payload:
                  if item["id"] in by_id:
                      if by_id[item["id"]] != item:
                          raise SystemExit(f"{name} {item['id']} already exists but does not exactly match Artifact export")
                  else:
                      collection.append(item)

          merge_exact(existing_events, events, "Event")
          merge_exact(existing_obs, observations, "SourceObservation")

          # Relationship and integrity checks before write.
          country_ids = set(data["countries"].keys())
          source_ids = set(existing_sources.keys())
          event_ids = {e["id"] for e in existing_events}
          obs_ids = {o["id"] for o in existing_obs}
          assert len(event_ids) == len(existing_events)
          assert len(obs_ids) == len(existing_obs)
          assert len(existing_events) == 6, len(existing_events)
          assert len(existing_obs) == 6, len(existing_obs)
          for e in existing_events:
              assert e["countryId"] in country_ids
              assert all(x in obs_ids for x in e["sourceObservationIds"])
              assert e["publicationStatus"] in {"PUBLISHED","DRAFT","INTERNAL_REVIEW","WITHDRAWN"}
          for o in existing_obs:
              assert o["sourceId"] in source_ids
              assert (o["recordId"] is None) ^ (o["eventId"] is None)
              if o["eventId"] is not None:
                  assert o["eventId"] in event_ids
          assert sum(1 for e in existing_events if e["publicationStatus"] == "PUBLISHED") == 3
          assert sum(1 for e in existing_events if e["publicationStatus"] == "DRAFT") == 3

          data.setdefault("meta", {}).setdefault("counts", {})
          data["meta"]["counts"]["countries"] = len(data["countries"])
          data["meta"]["counts"]["records"] = len(data["records"])
          data["meta"]["counts"]["sources"] = len(existing_sources)
          data["meta"]["counts"]["locations"] = len(data["locations"])
          data["meta"]["counts"]["events"] = len(existing_events)
          data["meta"]["counts"]["sourceObservations"] = len(existing_obs)

          out = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          path.write_text(out, encoding="utf-8")
          print("Merged exact Artifact Current Intelligence payload.")
          print("events:", len(existing_events), "sourceObservations:", len(existing_obs), "sources:", len(existing_sources))
          PY

      - name: Validate merged data
        run: |
          python3 scripts/validate_ti_data.py data.json

      - name: Commit migration
        run: |
          if git diff --quiet -- data.json; then
            echo "No data.json changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Migrate exact Artifact Current Intelligence data"
          git push origin ti-migration-2026-09
