name: Continuous intelligence agent tests
on:
  pull_request:
    paths:
      - "scripts/continuous_intelligence_monitor.py"
      - "scripts/ti_ops_director/**"
      - "config/ops_director_pricing.json"
      - "tests/test_ti_ops_director*.py"
      - "tests/test_continuous_intelligence_monitor.py"
      - "tests/fixtures/ops_director/**"
      - "tests/ops_support.py"
      - ".github/workflows/continuous-intelligence-monitor.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF text reader (country builder tests)
        run: python -m pip install pypdf==6.17.0
      - name: Syntax and offline tests
        run: |
          python -m py_compile scripts/continuous_intelligence_monitor.py
          python -m unittest discover -s tests -p 'test_continuous_intelligence_monitor.py' -v
          python -m unittest discover -s tests -p 'test_ti_ops_director*.py' -v
