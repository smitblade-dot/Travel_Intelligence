<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#23272c;color:#c9cfd5}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Travel Intelligence</title>
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#23272c; --bg-1:#2f353b; --bg-2:#3a4148;
    --bg:#23272c; --surface:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,0)); --surface-2:#2f353b; --border:rgba(255,255,255,.14);
    --text:#c9cfd5; --text-dim:#9aa2a9; --text-faint:#969ea6;
    --accent:#2b7cff; --accent-ink:#fff; --accent-soft:rgba(43,124,255,.12);
    --link:#5b9aff;
    --good:#58c98a; --good-soft:rgba(88,201,138,.12);
    --warn:#e7b45c; --warn-soft:rgba(231,180,92,.12);
    --crit:#ff2b3a; --crit-soft:rgba(255,43,58,.12);
    --mono: 'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --disp: 'Space Grotesk', var(--sans);
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    background:linear-gradient(180deg,var(--bg-0),var(--bg-1) 55%,var(--bg-2));
    color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.5;
    position:relative;
  }
  h1,h2,h3,h4{ font-family:var(--disp); font-weight:700; letter-spacing:-0.01em; text-wrap:balance; margin:0; }
  a{ color:var(--link); }
  button{ font-family:var(--sans); color:inherit; }
  #app{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:0 40px; min-height:100%; display:flex; flex-direction:column; }

  /* ---------- data-as-of strip (top of page) ---------- */
  .data-asof{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; text-align:center; font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); background:rgba(0,0,0,0.18); border-bottom:1px solid var(--border); padding:7px 14px; }
  .data-asof .dot{ width:6px; height:6px; border-radius:50%; background:var(--good); display:inline-block; flex:none; }
  .data-asof.stale .dot{ background:var(--warn); }
  .data-asof b{ color:var(--text-dim); font-weight:600; letter-spacing:0.08em; }

  /* ---------- topbar ---------- */
  .topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:rgba(35,39,44,.92); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:16px 12px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; border-inline-start:3px solid var(--accent); padding-inline-start:10px; color:var(--text); }
  .brand-name{ font-family:var(--disp); font-weight:700; font-size:16px; letter-spacing:0.14em; color:var(--text); }
  .brand-sub{ font-family:var(--mono); font-size:10.5px; color:var(--text-dim); letter-spacing:0.06em; text-transform:uppercase; }
  .topbar-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .search-wrap input{ width:220px; max-width:48vw; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:8px 10px; font-family:var(--sans); font-size:13.5px; }
  .search-wrap input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .admin-toggle{ display:none; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim); cursor:pointer; user-select:none; }
  .admin-toggle input{ appearance:none; width:30px; height:17px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); position:relative; cursor:pointer; transition:background .15s; }
  .admin-toggle input::after{ content:""; position:absolute; top:1px; left:1px; width:13px; height:13px; border-radius:50%; background:var(--text-faint); transition:transform .15s; }
  .admin-toggle input:checked{ background:var(--accent-soft); border-color:var(--accent); }
  .admin-toggle input:checked::after{ transform:translateX(13px); background:var(--accent); }
  .admin-toggle.on{ color:var(--accent); }

  main{ flex:1; padding-block:22px; }
  [hidden]{ display:none !important; }

  /* ---------- home ---------- */
  /* ---------- home hero (plain — no separate banner band, avoids a second header look) ---------- */
  .home-hero-banner{ margin-block-end:22px; }
  .home-hero{ max-width:64ch; }
  .home-hero .kicker{ font-family:var(--mono); font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin-block-end:10px; display:block; }
  .home-hero h1{ font-size:30px; letter-spacing:-0.01em; margin-block-end:8px; }
  .home-hero p{ color:var(--text-faint); font-size:12px; letter-spacing:0.01em; }
  .home-stats{ display:flex; gap:18px; margin-block-start:14px; font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.03em; }

  /* ---------- hotspots & hot topics (home) ---------- */
  .hotspot-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .hotspot-card{ display:flex; flex-direction:column; gap:6px; text-align:left; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--crit); border-radius:var(--radius); padding:13px 15px; cursor:pointer; color:var(--text); font-family:var(--sans); transition:border-color .12s, transform .12s; }
  .hotspot-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .hotspot-card.sev-amber{ border-left-color:var(--warn); }
  .hotspot-card .hs-top{ display:flex; align-items:center; gap:6px; }
  .hotspot-card .hs-flag{ font-size:16px; line-height:1; }
  .hotspot-card .hs-country{ font-weight:700; font-size:12.5px; flex:1; }
  .hotspot-card .hs-badge{ font-family:var(--mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:3px; border:1px solid var(--crit); color:var(--crit); background:var(--crit-soft); }
  .hotspot-card.sev-amber .hs-badge{ border-color:var(--warn); color:var(--warn); background:var(--warn-soft); }
  .hotspot-card .hs-title{ font-family:var(--disp); font-weight:600; font-size:13.5px; line-height:1.3; }
  .hotspot-card .hs-snippet{ font-size:12px; color:var(--text-dim); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .hotspot-card .hs-date{ font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-block-start:2px; }
  .hotspot-empty{ font-size:13px; color:var(--text-faint); padding:14px 0; }

  /* ---------- continents (home) ---------- */
  .continent-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .continent-card{ display:flex; flex-direction:column; gap:4px; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 17px; cursor:pointer; color:var(--text); font-family:var(--sans); transition:border-color .12s, transform .12s; }
  .continent-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .continent-card .co-name{ font-family:var(--disp); font-weight:700; font-size:15.5px; letter-spacing:.01em; }
  .continent-card .co-count{ font-family:var(--mono); font-size:11px; color:var(--text-faint); }
  .continent-card .co-og{ font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; color:var(--accent); margin-block-start:4px; }
  .country-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .country-card{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; transition:border-color .12s, transform .12s; font-family:var(--sans); color:var(--text); }
  .country-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .country-card .flag{ font-size:22px; line-height:1; }
  .country-card .c-name{ font-family:var(--disp); font-weight:700; font-size:14.5px; }
  .country-card .c-meta{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .country-card .c-region{ font-family:var(--mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; }
  .pill{ display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); }
  .pill.active{ color:var(--good); border-color:var(--good); background:var(--good-soft); }
  .pill.draft{ color:var(--warn); border-color:var(--warn); background:var(--warn-soft); }
  .pill.archived{ color:var(--text-faint); }
  .empty-home{ padding:30px 0; color:var(--text-dim); font-size:13.5px; }
  .admin-row{ margin-block-start:16px; }
  .offline-note{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:4px 10px; margin-block-start:10px; }
  .offline-note .dot{ width:6px; height:6px; border-radius:50%; background:var(--warn); display:inline-block; }
  .og-tag{ font-family:var(--mono); font-size:9px; letter-spacing:.04em; color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent); border-radius:3px; padding:1px 5px; }

  /* ---------- section headers (home) ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-block:26px 12px; }
  .section-head:first-of-type{ margin-block-start:6px; }
  .section-head h2{ font-size:14px; letter-spacing:.03em; }
  .section-head .section-hint{ font-family:var(--mono); font-size:11px; color:var(--text-faint); }

  /* ---------- category browse (home) ---------- */
  .category-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .category-card{ text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:11px 13px; cursor:pointer; display:flex; flex-direction:column; gap:3px; font-family:var(--sans); color:var(--text); }
  .category-card:hover{ border-color:var(--accent); }
  .category-card .cc-label{ font-weight:700; font-size:12.5px; }
  .category-card .cc-desc{ font-size:11px; color:var(--text-dim); line-height:1.3; }
  .category-card .cc-count{ font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-block-start:2px; }

  /* ---------- region groups (home) ---------- */
  .region-block{ margin-block-end:22px; }
  .region-heading{ display:flex; align-items:baseline; gap:8px; margin-block-end:8px; }
  .region-heading h3{ font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim); font-family:var(--mono); font-weight:600; }
  .region-heading .rh-count{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }

  /* ---------- category browse view ---------- */
  .cb-head{ margin-block-end:18px; }
  .cb-head h1{ font-size:22px; }
  .cb-head p{ color:var(--text-dim); font-size:13.5px; margin-block-start:4px; }
  .cb-list{ display:flex; flex-direction:column; gap:6px; }
  .cb-row{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:11px 14px; cursor:pointer; text-align:left; font-family:var(--sans); color:var(--text); width:100%; }
  .cb-row:hover{ border-color:var(--accent); }
  .cb-row .flag{ font-size:18px; }
  .cb-row .cb-name{ font-weight:700; font-size:13.5px; flex:1; }
  .cb-row .cb-region{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }
  .cb-row .cb-count{ font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--border); color:var(--text-faint); }
  .cb-row .cb-count.has{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); font-weight:600; }
  .cb-row .cb-warn{ color:var(--crit); font-family:var(--mono); font-size:10px; border:1px solid var(--crit); background:var(--crit-soft); padding:1px 6px; border-radius:3px; }

  /* ---------- location tree / manager ---------- */
  .loc-tree{ display:flex; flex-direction:column; gap:4px; margin-block-end:14px; }
  .loc-row{ display:flex; align-items:center; gap:8px; padding:7px 9px; background:linear-gradient(180deg,var(--bg-0),var(--bg-1) 55%,var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius); }
  .loc-row .loc-name{ font-weight:600; font-size:13px; }
  .loc-row .loc-type{ font-family:var(--mono); font-size:9.5px; color:var(--text-faint); border:1px solid var(--border); border-radius:3px; padding:1px 5px; }
  .loc-row .loc-actions{ margin-inline-start:auto; display:flex; gap:4px; }
  .loc-empty{ font-size:12.5px; color:var(--text-dim); padding:10px 0; }

  /* ---------- buttons ---------- */
  .btn{ font-family:var(--sans); font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 13px; border-radius:var(--radius); cursor:pointer; }
  .btn:hover{ border-color:var(--accent); }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-accent:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-dim); padding:6px 8px; }
  .btn-ghost:hover{ color:var(--text); }
  .btn-danger{ color:var(--crit); border-color:var(--crit); background:var(--crit-soft); }
  .btn-sm{ font-size:11.5px; padding:5px 9px; }
  .back-btn{ background:none; border:none; color:var(--text-dim); font-family:var(--mono); font-size:12px; cursor:pointer; padding:0 0 14px; letter-spacing:.02em; }
  .back-btn:hover{ color:var(--accent); }

  /* ---------- country header ---------- */
  .country-header{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-block-end:16px; }
  .ch-top{ display:flex; gap:14px; align-items:flex-start; }
  .flag-lg{ font-size:34px; line-height:1; }
  .ch-title-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .ch-top h1{ font-size:22px; }
  .official{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); font-weight:400; }
  .ch-tags{ display:flex; gap:8px; margin-block-start:6px; flex-wrap:wrap; }
  .ch-tags span{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); }
  .ch-admin{ margin-inline-start:auto; }
  .ch-facts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px 16px; margin-block-start:16px; padding-block-start:14px; border-top:1px solid var(--border); }
  .ch-facts div{ display:flex; flex-direction:column; gap:2px; }
  .ch-facts label{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); }
  .ch-facts span{ font-size:13.5px; font-weight:500; font-variant-numeric:tabular-nums; }
  .ch-emergency{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-block-start:14px; padding:10px 12px; background:var(--crit-soft); border:1px solid var(--crit); border-radius:var(--radius); }
  .ee-label{ font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.08em; color:var(--crit); }
  .ch-emergency .ee-item{ font-family:var(--mono); font-size:12.5px; color:var(--text); font-variant-numeric:tabular-nums; }
  .ch-emergency .ee-item b{ color:var(--crit); }

  /* ---------- category nav ---------- */
  .cat-nav{ display:flex; flex-wrap:wrap; gap:7px; padding-block:2px 14px; margin-block-end:4px; }
  .cat-nav button{ flex:none; display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11.5px; letter-spacing:.02em; white-space:nowrap; padding:7px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer; transition:border-color .12s, color .12s; }
  .cat-nav button::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--border); flex:none; }
  .cat-nav button:hover{ border-color:var(--accent); color:var(--text); }
  .cat-nav button.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .cat-nav button.active::before{ background:var(--accent-ink); }
  .cat-nav button .cnt{ opacity:.7; margin-inline-start:3px; }

  /* ---------- record cards ---------- */
  .cat-content{ display:flex; flex-direction:column; gap:10px; }
  .record-card{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .record-card.dt-WARNING{ border-left-color:var(--crit); }
  .record-card.dt-REQUIREMENT{ border-left-color:var(--accent); }
  .record-card.dt-CONSIDERATION{ border-left-color:var(--warn); }
  .record-card.dt-CONTACT{ border-left-color:var(--link); }
  .rc-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-block-end:8px; }
  .badge{ font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:3px; border:1px solid var(--border); color:var(--text-dim); }
  .badge.dt-WARNING{ color:var(--crit); border-color:var(--crit); background:var(--crit-soft); }
  .badge.dt-REQUIREMENT{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .badge.dt-CONSIDERATION{ color:var(--warn); border-color:var(--warn); background:var(--warn-soft); }
  .badge.dt-FACT{ color:var(--text-dim); }
  .badge.dt-CONTACT{ color:var(--link); border-color:var(--link); }
  .badge.dt-STATISTIC, .badge.dt-PROCEDURE{ color:var(--text-dim); }
  .badge.conf-HIGH{ color:var(--good); border-color:var(--good); background:var(--good-soft); }
  .badge.conf-MEDIUM{ color:var(--warn); border-color:var(--warn); background:var(--warn-soft); }
  .badge.conf-LOW{ color:var(--text-faint); }
  .rc-sub{ font-family:var(--mono); font-size:11px; color:var(--text-faint); }
  .rc-scope{ margin-inline-start:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); background:var(--surface-2); padding:2px 7px; border-radius:20px; }
  .record-card h3{ font-size:15px; font-weight:700; margin-block-end:5px; }
  .record-card p{ color:var(--text); font-size:13.8px; margin:0 0 10px; white-space:pre-wrap; }
  .rc-source{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; color:var(--text-dim); padding-block-start:9px; border-top:1px solid var(--border); }
  .rc-source a{ text-decoration:none; }
  .rc-source a:hover{ text-decoration:underline; }
  .rc-source .tier{ color:var(--text-faint); }
  .rc-admin{ display:flex; gap:6px; margin-block-start:10px; }

  .empty-state{ background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); padding:26px 20px; text-align:center; color:var(--text-dim); font-size:13.5px; }
  .empty-state .empty-hint{ font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-block-start:6px; }
  .empty-state .btn{ margin-block-start:14px; }

  /* overview */
  .overview-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
  .ov-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
  .ov-card label{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); display:block; margin-block-end:4px; }
  .ov-card span{ font-size:14.5px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ov-note{ grid-column:1/-1; font-size:12.5px; color:var(--text-dim); background:var(--surface-2); border-radius:var(--radius); padding:10px 12px; }

  /* sources */
  .source-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; display:flex; flex-direction:column; gap:4px; }
  .source-card .sc-head{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .source-card .sc-org{ font-weight:700; font-size:13.8px; }
  .source-card .sc-meta{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  "br-security-essential":{"category":"SECURITY","confidence":"HIGH","content":"The FCDO advises against all but essential travel to certain parts of Brazil \u2014 check the specific areas before travelling.","countryId":"br","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"br-fcdo-security","status":"ACTIVE","subcategory":"Movement restrictions","title":"FCDO advises against all but essential travel to parts of Brazil"},

  "ca-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must be valid for the duration of your stay in Canada; many transit countries separately require at least 6 months' remaining validity.","countryId":"ca","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"ca-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport valid for duration of stay; 6 months for onward transit"},
  "ca-health-cost":{"category":"HEALTH","confidence":"HIGH","content":"Medical treatment can be very expensive with no special arrangements for British visitors; access emergency care via hospital emergency rooms or walk-in clinics.","countryId":"ca","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"ca-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Medical treatment can be very expensive for visitors"},
  "ca-security-cannabis":{"category":"SECURITY","confidence":"MEDIUM","content":"Cannabis is legal for recreational use within Canada, but it is illegal to take cannabis across the Canadian border without a permit or exemption \u2014 severe penalties apply.","countryId":"ca","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"ca-fcdo-security","status":"ACTIVE","subcategory":"Import restrictions","title":"Cannabis legal in Canada but illegal to cross the border with it"},
  "ca-security-terrorism":{"category":"SECURITY","confidence":"MEDIUM","content":"There is a threat of terrorist attacks in Canada; the FCDO assesses that terrorists are likely to try to carry out attacks, which could be indiscriminate and affect places visited by foreign nationals. Past incidents include a 2023 stabbing attack in Surrey, British Columbia, and a 2021 vehicle attack in London, Ontario that killed four people.","countryId":"ca","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"ca-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Significant threat of terrorist attack"},
  "ca-security-wildfire":{"category":"ENVIRONMENT","confidence":"MEDIUM","content":"Western Canada faces a significant wildfire risk in summer \u2014 follow local warnings and news for the latest outbreaks. Winter storms (November-April) bring blizzards and freezing rain causing dangerous driving conditions. Tornadoes can occur May-September (peak June-July) in southern regions, hurricanes may affect coastal areas July-November, and avalanches are a risk in mountainous regions such as Alberta and British Columbia.","countryId":"ca","dataType":"CONSIDERATION","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"ca-fcdo-security","status":"ACTIVE","subcategory":"Wildfire","title":"Wildfires common in western Canada in summer"},

  "cn-entry-visafree":{"category":"ENTRY","confidence":"HIGH","content":"Until 31 December 2026, British citizens can enter China visa-free for stays up to 30 days for business, tourism, or family/friend visits. Longer stays, work, or study require a visa arranged in advance \u2014 a tourist/business visa does not permit working.","countryId":"cn","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Time-limited exemption \u2014 re-verify closer to end of 2026.","reviewDate":"2027-03-17","sourceId":"cn-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa-free for up to 30 days until 31 Dec 2026"},
  "cn-health-cost":{"category":"HEALTH","confidence":"HIGH","content":"Medical care in China is not subsidised for visitors and carries substantial costs. Comprehensive travel insurance covering healthcare, evacuation and repatriation is essential.","countryId":"cn","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"cn-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Medical care not subsidised for visitors \u2014 comprehensive insurance essential"},
  "cn-health-water":{"category":"HEALTH","confidence":"MEDIUM","content":"Tap water is unsafe in China; consume only bottled water. Notable disease risks include avian influenza and dengue fever (concentrated in Guangdong Province, mainly May-November).","countryId":"cn","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"cn-fcdo-health","status":"ACTIVE","subcategory":"Food and water","title":"Tap water is unsafe \u2014 drink bottled water only"},
  "cn-security-detention":{"category":"SECURITY","confidence":"HIGH","content":"China's broad national security laws mean foreigners may be detained without having intended to break the law, potentially for up to 6 months before formal charges. Exit bans can be imposed for commercial disputes or investigations, lasting months or years without notice.","countryId":"cn","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"cn-fcdo-security","status":"ACTIVE","subcategory":"Movement restrictions","title":"Broad security laws create arbitrary detention risk"},

  "eg-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"British passport holders typically need a visa: online e-visa (valid up to 3 months), via the Egyptian Consulate, or on arrival at approved airports (30 USD cash, valid up to 30 days). No visa is required for under-15-day stays in Sharm El-Sheikh, Dahab, Nuweiba or Taba resorts if arriving by air. Digital visas at Cairo Airport from 1 Aug 2026 cost 36 USD by card.","countryId":"eg","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"eg-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa required; e-visa, on-arrival, or Sharm exemption available"},
  "eg-health-medication":{"category":"HEALTH","confidence":"HIGH","content":"Certain prescription and over-the-counter medications are controlled substances in Egypt and may require prior authorisation from Egypt's Ministry of Health. Travellers should carry a GP letter documenting condition, dosage and personal use, or risk confiscation and prosecution.","countryId":"eg","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"eg-fcdo-health","status":"ACTIVE","subcategory":"Medication","title":"Some medicines controlled; prior authorisation may be needed"},
  "eg-health-quality":{"category":"HEALTH","confidence":"MEDIUM","content":"Some hotel doctors have significantly overcharged patients, though pharmacies outside hotels are more affordable. Specialised psychiatric care is limited outside major cities.","countryId":"eg","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"eg-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Hotel doctors may overcharge; specialist care limited"},
  "eg-health-risks":{"category":"HEALTH","confidence":"MEDIUM","content":"Health risks include dengue fever and tick-borne illnesses, particularly Crimean-Congo haemorrhagic fever; altitude sickness is a risk in certain regions.","countryId":"eg","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"eg-fcdo-health","status":"ACTIVE","subcategory":"Health risks","title":"Dengue and tick-borne illness including CCHF"},
  "eg-security-crime":{"category":"SECURITY","confidence":"MEDIUM","content":"Overall crime rates are low, but sexual assaults have been reported, particularly at Red Sea resorts, often involving accommodation staff. Female travellers should avoid solo taxi rides, especially at night.","countryId":"eg","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"eg-fcdo-security","status":"ACTIVE","subcategory":"Crime","title":"Low overall crime; sexual assault reports at Red Sea resorts"},

  "es-entry-ees":{"category":"ENTRY","confidence":"HIGH","content":"The EU's Entry/Exit System requires biometric registration (fingerprints and photo) on first entry to the Schengen area; free of charge and valid for three years.","countryId":"es","dataType":"PROCEDURE","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"es-fcdo-entry","status":"ACTIVE","subcategory":"Other","title":"EU Entry/Exit System (EES) biometric registration"},
  "es-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must have been issued less than 10 years before your arrival date, and have an expiry date at least 3 months after you plan to leave the Schengen area. Passports renewed before 1 October 2018 may be affected.","countryId":"es","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Stated for British nationals; verify equivalent rule for other nationalities.","reviewDate":"2027-03-17","sourceId":"es-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport must meet Schengen age/validity rules"},
  "es-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"British citizens can enter visa-free for tourism, family visits, events or short study for up to 90 days in any 180-day period. Time spent in other Schengen countries counts towards this limit; overstaying risks a 3-year Schengen ban.","countryId":"es","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"es-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa-free for up to 90 days in any 180-day period"},
  "es-health-quality":{"category":"HEALTH","confidence":"HIGH","content":"Public healthcare is generally adequate, but tourist areas may lack nearby public facilities, and private doctors/hospitals do not accept GHIC/EHIC cards. Travel insurance remains essential for repatriation and non-urgent treatment.","countryId":"es","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"es-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"GHIC/EHIC does not replace travel insurance"},
  "es-security-balearics":{"category":"SECURITY","confidence":"MEDIUM","content":"Specific resort areas (Magaluf, Playa de Palma, San Antonio in Ibiza) see recurring dangerous balcony incidents and illegal commercial parties. There have been a number of serious accidents, some fatal, involving falls from height including balconies; travel insurance may not cover incidents involving alcohol or drug use.","countryId":"es","dataType":"CONSIDERATION","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"es-fcdo-security","status":"ACTIVE","subcategory":"Public behaviour","title":"Balcony falls and illegal parties in resort areas"},
  "es-security-terrorism":{"category":"SECURITY","confidence":"HIGH","content":"The UK assesses a high threat of terrorist attack globally, and terrorists are considered likely to try to carry out attacks in Spain. Attacks can be indiscriminate, including in places visited by foreigners.","countryId":"es","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"es-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Terrorism threat assessed as high"},
  "es-security-theft":{"category":"SECURITY","confidence":"MEDIUM","content":"Organised theft using distraction tactics is common, particularly at airports and around luggage handling. 'Highway pirates' target foreign-registered and hire vehicles; scammers may pose as plainclothes police to rob travellers.","countryId":"es","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"es-fcdo-security","status":"ACTIVE","subcategory":"Petty crime","title":"Organised theft targets tourists, especially at airports"},
  "gb-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"999 (or the EU-standard 112) covers ambulance, fire and police services nationally.","countryId":"gb","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"gb-emergency","status":"ACTIVE","subcategory":"Ambulance","title":"Emergency number: 999 (or 112)"},
  "gb-entry-eta":{"category":"ENTRY","confidence":"HIGH","content":"Most visitors to the UK need an ETA (Electronic Travel Authorisation) or a visa; requirement depends on nationality and purpose of visit. British and Irish passport holders, and those with permission to live/work/study in the UK, do not need an ETA. An ETA costs \u00a320, is applied for online, and permits travel to the UK, Jersey, Guernsey or the Isle of Man for up to 6 months.","countryId":"gb","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Nationality-dependent \u2014 check gov.uk for the specific traveller's passport before booking.","reviewDate":"2027-03-17","sourceId":"gb-eta","status":"ACTIVE","subcategory":"Visa","title":"Most visitors need an ETA or visa depending on nationality"},
  "gb-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"A passport or travel document is required to enter the UK and should be valid for the whole of the stay (no fixed minimum extra-validity period is stated, unlike many other countries).","countryId":"gb","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"gb-visitor-visa","status":"ACTIVE","subcategory":"Passport","title":"Passport must be valid for the whole stay"},
  "gb-entry-visitorvisa":{"category":"ENTRY","confidence":"HIGH","content":"Nationalities that need a visa (rather than an ETA) can apply for a Standard Visitor visa, allowing tourism, family visits, business meetings and permitted paid engagements for up to 6 months. It costs \u00a3135 and can be applied for up to 3 months before travel. Paid or unpaid work (other than permitted engagements) is prohibited on this route.","countryId":"gb","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Relevant for non-ETA-eligible personnel (e.g. some Middle East/Africa passport holders) visiting UK offices.","reviewDate":"2027-03-17","sourceId":"gb-visitor-visa","status":"ACTIVE","subcategory":"Visa","title":"Standard Visitor visa allows up to 6 months for business/tourism"},
  "gb-health-nhs":{"category":"HEALTH","confidence":"MEDIUM","content":"Healthcare in the UK is of a high standard via the National Health Service (NHS). Emergency treatment is provided regardless of nationality, but visitors from countries without a reciprocal healthcare agreement with the UK may be charged for treatment, including hospital care.","countryId":"gb","dataType":"FACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"gb-emergency","status":"ACTIVE","subcategory":"Healthcare","title":"NHS treatment; visitors from non-reciprocal countries may be charged"},
  "gb-security-general":{"category":"SECURITY","confidence":"MEDIUM","content":"The UK is not covered by FCDO self-facing travel advice since it is the issuing government; general safety levels are consistent with a developed Western European country. Ordinary situational-awareness precautions (as in any major city) are sufficient for routine business travel.","countryId":"gb","dataType":"FACT","dateChecked":"2026-09-17","locationId":null,"notes":"No official FCDO 'advice against travel' equivalent exists for the UK \u2014 this is Claude's contextual summary, not a sourced FCDO record like other countries.","reviewDate":"2027-09-17","sourceId":"gb-emergency","status":"ACTIVE","subcategory":"General safety","title":"Low routine risk; standard UK safety precautions apply"},
  "id-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Ambulance: 118. Fire: 112. Police: 110.","countryId":"id","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"id-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Ambulance: 118, Fire: 112, Police: 110"},
  "id-entry-declaration":{"category":"ENTRY","confidence":"MEDIUM","content":"Complete the 'All Indonesia Declaration Form' online within 72 hours of arrival (free). Register with local police if staying in private accommodation (5 million rupiah fine otherwise). A Bali tourist levy of 150,000 rupiah applies on arrival in Bali.","countryId":"id","dataType":"PROCEDURE","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-entry","status":"ACTIVE","subcategory":"Registration","title":"Online arrival declaration and Bali tourist levy"},
  "id-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Passport must be valid for at least 6 months after arrival and have at least 2 blank pages.","countryId":"id","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport valid 6 months beyond arrival, 2 blank pages"},
  "id-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"A visa is mandatory. Visa-on-arrival (500,000 IDR, 30 days, single entry) is available at major airports/seaports for tourism and some business; online visas can be applied for at least a week ahead with multiple-entry/60-day options, but must be approved before arrival. The 30-day visa can be extended once for a further 30 days within the initial period.","countryId":"id","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa mandatory; visa-on-arrival (30 days) or online e-visa options"},
  "id-health-quality":{"category":"HEALTH","confidence":"HIGH","content":"Standards of local medical care can be poor and some tests cannot be performed reliably; psychological services are particularly limited. Remote areas lack capacity for serious injury/illness; good care can be prohibitively expensive.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Inconsistent standards; remote areas lack serious-injury capacity"},
  "id-health-risks":{"category":"HEALTH","confidence":"MEDIUM","content":"Health risks include unhealthy air quality during dry-season wildfires (May-November), volcanic ash exposure, Zika virus, dengue fever, malaria, and rabies from street dogs and monkeys.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-health","status":"ACTIVE","subcategory":"Health risks","title":"Air quality, Zika, dengue, malaria, rabies"},
  "id-health-water":{"category":"HEALTH","confidence":"HIGH","content":"Tap water is not safe to drink in Indonesia.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-health","status":"ACTIVE","subcategory":"Water safety","title":"Tap water is not safe to drink"},
  "id-security-crime":{"category":"SECURITY","confidence":"MEDIUM","content":"High rates of sexual assault are reported in Bali and Lombok; avoid poorly lit areas at night. Drink spiking incidents are documented in Bali, Lombok and the Gili Islands. Counterfeit alcohol containing methanol has caused deaths.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-security","status":"ACTIVE","subcategory":"Crime","title":"Sexual assault and drink-spiking reported in Bali/Lombok"},
  "id-security-laws":{"category":"SECURITY","confidence":"HIGH","content":"All forms of cannabis are illegal with airports using advanced detection technology; drug possession carries lengthy prison sentences or the death penalty. Aceh Province enforces Sharia law, banning alcohol and prohibiting LGBT+ activity, gambling and extramarital relations.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-security","status":"ACTIVE","subcategory":"Local laws","title":"Zero tolerance for drugs; Sharia law in Aceh"},
  "id-security-naturaldisaster":{"category":"SECURITY","confidence":"HIGH","content":"Volcanoes are active throughout Indonesia and can erupt without warning, with evacuation zones typically 3-7km. Earthquakes and tsunamis occur regularly. Flooding is common October-March; wildfires April-September generate widespread haze.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"id-fcdo-security","status":"ACTIVE","subcategory":"Natural disasters","title":"Active volcanoes, earthquakes and tsunamis"},
  "id-security-noall":{"category":"SECURITY","confidence":"HIGH","content":"The FCDO advises against all travel to parts of Indonesia \u2014 see the regional risks guidance for specific areas.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2026-12-17","sourceId":"id-fcdo-security","status":"ACTIVE","subcategory":"Regional risk","title":"FCDO advises against all travel to parts of Indonesia"},
  "id-security-terrorism":{"category":"SECURITY","confidence":"HIGH","content":"Terrorists are likely to try to carry out attacks in Indonesia. Islamist extremism remains elevated, with potential targets including beach resorts, hotels, markets, tourist attractions, embassies and airports. Heightened risk periods include Christmas, New Year, Easter, Chinese New Year, Ramadan and elections.","countryId":"id","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"id-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"High threat; targets include resorts, hotels and airports"},
  "il-entry-eta":{"category":"ENTRY","confidence":"HIGH","content":"Since 1 January 2025, an Electronic Travel Authorisation (ETA) is required before arrival, valid for 2 years and covering visits of up to 90 days; the ETA costs 25 new Israeli shekels and is applied for via the Israel Population and Immigration Authority. Passports must be valid for at least 90 days beyond the arrival date.","countryId":"il","dataType":"REQUIREMENT","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"il-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Electronic Travel Authorisation (ETA) required since Jan 2025"},
  "il-entry-refusal":{"category":"ENTRY","confidence":"MEDIUM","content":"Entry may be refused to those who have publicly called for a boycott of Israel or Israeli settlements, belong to an organisation that has, or have publicly denied the Holocaust or the 7 October 2023 attack.","countryId":"il","dataType":"CONSIDERATION","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"il-fcdo-entry","status":"ACTIVE","subcategory":"Entry refusal","title":"Grounds for entry refusal beyond standard requirements"},
  "il-security-advice":{"category":"SECURITY","confidence":"HIGH","content":"The FCDO advises against all travel to Gaza and against all but essential travel to parts of Israel, including areas near the Lebanon border (affected by conflict with Hizballah) and near the Egypt border (kidnap risk).","countryId":"il","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"il-fcdo-security","status":"ACTIVE","subcategory":"Movement restrictions","title":"Advises against travel to Gaza and parts of Israel"},
  "il-security-rockets":{"category":"SECURITY","confidence":"HIGH","content":"Rocket, drone and missile fire (including from Houthi forces in Yemen) poses a risk throughout Israel, including from interception debris; Ben Gurion Airport can face disruption. Two Houthi drones fell in Eilat in September 2025, injuring at least 20 people.","countryId":"il","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"il-fcdo-security","status":"ACTIVE","subcategory":"Rocket/missile risk","title":"Rocket, drone and missile risk nationwide"},
  "il-security-terrorism":{"category":"SECURITY","confidence":"HIGH","content":"Terrorists are very likely to try to carry out attacks in Israel and Palestine, with an increased threat of attacks including by individuals acting alone. Recent incidents include a September 2025 shooting in northern Jerusalem (six killed, eight wounded), bomb discoveries on Tel Aviv buses in February 2025, and multiple stabbing/ramming attacks.","countryId":"il","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"il-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Very likely terrorist attacks, including lone-actor risk"},
  "iq-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Emergency ambulance number: 122.","countryId":"iq","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"iq-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Ambulance emergency number: 122"},

  "iq-entry-currency":{"category":"ENTRY","confidence":"MEDIUM","content":"Declare local currency exceeding 200,000 Iraqi dinars, or foreign currency/valuables over $10,000 USD equivalent.","countryId":"iq","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"iq-fcdo-entry","status":"ACTIVE","subcategory":"Customs","title":"Currency declaration thresholds"},
  "iq-entry-evisa":{"category":"ENTRY","confidence":"HIGH","content":"A visa is mandatory for all visits, applied for via the Government of Iraq e-visa portal at least 24 hours before travel ($160 USD, valid for a 60-day stay). A return or onward ticket is normally required. The Kurdistan Region has a separate e-visa/visa-on-arrival scheme valid only within that region.","countryId":"iq","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"iq-fcdo-entry","status":"ACTIVE","subcategory":"eVisa","title":"E-visa required via Iraqi government portal (60-day stay)"},
  "iq-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must be valid for at least 6 months beyond your arrival date and contain at least one blank page. Passports reported lost or stolen will result in entry denial.","countryId":"iq","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Relevant given ongoing placement at Eni LSC, Zubair.","reviewDate":"2027-03-17","sourceId":"iq-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport must be valid 6+ months, one blank page"},
  "iq-health-risks":{"category":"HEALTH","confidence":"MEDIUM","content":"Iraq presents health risks including Crimean-Congo haemorrhagic fever and malaria, plus respiratory risk from dust/sand storms and altitude sickness in some regions.","countryId":"iq","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"iq-fcdo-health","status":"ACTIVE","subcategory":"Vector diseases","title":"Crimean-Congo haemorrhagic fever and malaria present"},
  "iq-security-civilunrest":{"category":"SECURITY","confidence":"MEDIUM","content":"Regular protests occur, sometimes with casualties. Curfews and vehicle bans may be imposed suddenly around holidays, pilgrimages or elections. Anti-British/American sentiment can escalate during political tensions.","countryId":"iq","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"iq-fcdo-security","status":"ACTIVE","subcategory":"Civil unrest","title":"Protests, curfews and vehicle bans can occur with little warning"},
  "iq-security-kidnap":{"category":"SECURITY","confidence":"HIGH","content":"There is a high threat of kidnapping throughout Iraq from terrorist and militant groups including Daesh. British nationals \u2014 including oil workers, business travellers and humanitarian workers \u2014 are considered legitimate targets. The UK government does not pay ransoms.","countryId":"iq","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"iq-fcdo-security","status":"ACTIVE","subcategory":"Kidnap","title":"High threat of kidnapping nationwide"},
  "iq-security-terrorism":{"category":"SECURITY","confidence":"HIGH","content":"Terrorists are very likely to try to carry out attacks in Iraq, particularly in provinces with former Daesh strongholds (Anbar, Diyala, Ninewah, Salah Al-Din, Kirkuk). Attacks include bombings, rockets, mortars, shootings and vehicle-borne explosives, targeting airports, markets, hotels, government buildings and religious sites. Foreign nationals, including oil workers, are considered high-value targets.","countryId":"iq","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly. Directly relevant to Eni LSC placement.","reviewDate":"2026-12-17","sourceId":"iq-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Very high threat of terrorist attack nationwide"},
  "ir-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Dial 115 for an ambulance.","countryId":"ir","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"ir-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Emergency number: 115"},
  "ir-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"A visa is mandatory (unless holding an Iranian passport), obtained either through an organised tour or with an in-country sponsor; the process is described as long and unpredictable, so apply well in advance. Passports with Israeli stamps may be denied entry, and Iran does not recognise dual nationality.","countryId":"ir","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"The FCDO advises against all travel \u2014 see the SECURITY category.","reviewDate":"2027-03-17","sourceId":"ir-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa required via organised tour or in-country sponsor"},
  "ir-health-quality":{"category":"HEALTH","confidence":"MEDIUM","content":"Medical infrastructure varies considerably by location \u2014 urban centres offer reasonable facilities but remote areas have limited services, and there have been documented shortages of basic medicines nationwide.","countryId":"ir","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"ir-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Variable quality; shortages of basic medicines reported"},
  "ir-security-advisory":{"category":"SECURITY","confidence":"HIGH","content":"The FCDO advises against all travel to Iran and warns British nationals face risk of arrest, detention and even a death sentence. The UK cannot guarantee evacuation or face-to-face consular assistance during a crisis.","countryId":"ir","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least monthly. Directly relevant given regional oil & gas work.","reviewDate":"2026-12-17","sourceId":"ir-fcdo-security","status":"ACTIVE","subcategory":"General security","title":"FCDO advises against all travel to Iran"},
  "ir-security-borderareas":{"category":"SECURITY","confidence":"HIGH","content":"Travel within 100km of the Afghanistan border, or within 10km of the Iraq border, is strongly advised against.","countryId":"ir","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"ir-fcdo-security","status":"ACTIVE","subcategory":"Border areas","title":"Avoid travel near the Afghanistan and Iraq borders"},
  "ir-security-detention":{"category":"SECURITY","confidence":"HIGH","content":"Holding a British passport or perceived UK connections can be reason enough for detention. British-Iranian dual nationals may not be notified to the UK government if detained, and consular access is not guaranteed. Risk increases for anyone linked to civil society, journalism, or with connections to Israel or the US.","countryId":"ir","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least monthly.","reviewDate":"2026-12-17","sourceId":"ir-fcdo-security","status":"ACTIVE","subcategory":"Movement restrictions","title":"Very high risk of arrest/detention, especially for dual nationals"},
  "jo-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Ambulance emergency number: 911.","countryId":"jo","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"jo-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Ambulance emergency number: 911"},
  "jo-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must have an expiry date at least 6 months after the date you arrive in Jordan.","countryId":"jo","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Stated for British nationals; verify equivalent rule for other nationalities.","reviewDate":"2027-03-17","sourceId":"jo-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport must be valid at least 6 months beyond arrival"},
  "jo-entry-registration":{"category":"ENTRY","confidence":"MEDIUM","content":"Visitors remaining over 14 days must register with local police within that timeframe, providing biometrics. Failure results in a 200 JOD fine on departure.","countryId":"jo","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jo-fcdo-entry","status":"ACTIVE","subcategory":"Registration","title":"Stays over 14 days require police registration"},
  "jo-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"A visa is mandatory. Options include a single-entry visa on arrival at airports/the Sheikh Hussein or North Border crossing (40 JOD, 3 months validity), or the Jordan Pass for tourism stays of 3+ nights (70-80 JOD, applied for online before arrival, includes tourist-site discounts). Non-tourism visits should apply in advance via the Ministry of Interior.","countryId":"jo","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jo-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa on arrival, or Jordan Pass for tourism stays of 3+ nights"},
  "jo-health-facilities":{"category":"HEALTH","confidence":"HIGH","content":"Medical facilities outside Amman and Aqaba are basic; in an emergency, seek treatment in Amman or Aqaba.","countryId":"jo","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jo-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Medical facilities outside Amman and Aqaba are basic"},
  "jo-security-regionaltension":{"category":"SECURITY","confidence":"HIGH","content":"There is a risk of escalating regional conflict; recent Iranian and US strikes have occurred in the region including near Aqaba. Avoid military/strategic facilities, follow local advice to shelter if instructed, and expect possible flight cancellations and airspace closures.","countryId":"jo","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"jo-fcdo-security","status":"ACTIVE","subcategory":"Conflict","title":"Risk of regional escalation, including strikes near Aqaba"},
  "jo-security-syriaborder":{"category":"SECURITY","confidence":"HIGH","content":"The FCDO advises against all travel within 3km of the border with Syria.","countryId":"jo","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"jo-fcdo-security","status":"ACTIVE","subcategory":"Border areas","title":"Avoid all travel within 3km of the Syria border"},
  "jp-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Dial 119 for an ambulance.","countryId":"jp","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"jp-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Ambulance emergency number: 119"},
  "jp-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must remain valid for the whole of your stay and have a blank page for the visa stamp. Passports reported lost or stolen will result in entry denial.","countryId":"jp","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jp-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport must be valid for duration of stay, one blank page"},
  "jp-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"British citizens can get a visa on arrival for tourism or business for up to 90 days without prior application; a further 90-day extension can be requested at a local immigration office. Work or study requires an appropriate visa arranged beforehand \u2014 overstaying can mean arrest, detention and a heavy fine.","countryId":"jp","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jp-fcdo-entry","status":"ACTIVE","subcategory":"Visa on arrival","title":"Visa on arrival for tourism/business up to 90 days"},
  "jp-health-cost":{"category":"HEALTH","confidence":"HIGH","content":"Medical facilities are high standard, but treatment is expensive with patients responsible for full costs and insurance checks that may delay treatment.","countryId":"jp","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jp-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"High standard but expensive; full cost due upfront"},
  "jp-health-medication":{"category":"HEALTH","confidence":"HIGH","content":"Japan enforces strict anti-stimulant drug laws; some common items such as Vicks inhalers and certain allergy/cold medications or painkillers are banned. Foreign nationals have been detained and deported for bringing them in \u2014 verify medication legality with the Japanese Embassy in the UK beforehand.","countryId":"jp","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jp-fcdo-health","status":"ACTIVE","subcategory":"Medication","title":"Strict bans on common medicines (e.g. some inhalers, allergy/cold medicine)"},
  "jp-security-druggedcrime":{"category":"SECURITY","confidence":"MEDIUM","content":"Tokyo's entertainment districts (Kabukicho, Roppongi, Shibuya, Ikebukuro) carry a higher risk of crime at night. Victims of drink-spiking scams have reported large unauthorised credit card charges. Avoid touts who approach speaking English.","countryId":"jp","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jp-fcdo-security","status":"ACTIVE","subcategory":"Petty crime","title":"Drink-spiking and fraud in Tokyo entertainment districts"},
  "jp-security-earthquake":{"category":"ENVIRONMENT","confidence":"HIGH","content":"Japan is in a major earthquake zone with associated tsunami risk. Monitor local alerts and follow local authority instructions. Typhoon season runs June-December (peak July-September), bringing high tides, landslide and flood risk. Multiple active volcanoes require monitoring of local alerts.","countryId":"jp","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jp-fcdo-security","status":"ACTIVE","subcategory":"Earthquake","title":"Japan is in a major earthquake and tsunami zone"},
  "jp-security-legal":{"category":"SECURITY","confidence":"HIGH","content":"Travellers can be detained without charge for up to 23 days for minor offences. Drug possession carries zero tolerance with sentences of 6-17 years. You must carry your passport or residence card at all times.","countryId":"jp","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"jp-fcdo-security","status":"ACTIVE","subcategory":"Movement restrictions","title":"Detention without charge possible; zero tolerance on drugs"},

  "kw-entry-israelstamp":{"category":"ENTRY","confidence":"MEDIUM","content":"If your passport contains an Israeli stamp, you may be denied entry or a visa.","countryId":"kw","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"kw-fcdo-entry","status":"ACTIVE","subcategory":"Other","title":"Israeli passport stamps may cause entry/visa refusal"},
  "kw-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must be valid for at least 6 months beyond your arrival date; for residency visas, at least 2 years' validity is required.","countryId":"kw","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"kw-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport valid 6+ months (2 years for residency visas)"},
  "kw-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"A visa is mandatory, available on arrival at Kuwaiti airports or online via the Ministry of Interior. British citizens born in Afghanistan, Iran, Iraq, Lebanon, Pakistan, Sudan, Syria or Yemen cannot get a visa on arrival and must apply through the Kuwaiti Embassy beforehand.","countryId":"kw","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Relevant given oil & gas travellers' varied birthplaces/travel histories.","reviewDate":"2027-03-17","sourceId":"kw-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa on arrival or online \u2014 exceptions for some birthplaces"},
  "kw-health-medication":{"category":"HEALTH","confidence":"HIGH","content":"Under Kuwaiti rules, visitors must obtain permission from the Kuwaiti authorities to carry certain prescription drugs before arrival \u2014 this covers many commonly prescribed medications, so prepare documentation well in advance.","countryId":"kw","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"kw-fcdo-health","status":"ACTIVE","subcategory":"Medication","title":"Prior permission needed for certain prescription drugs"},
  "kw-security-borders":{"category":"SECURITY","confidence":"HIGH","content":"It is illegal and dangerous to go near Kuwait's borders with Iraq and Saudi Arabia without authorisation; armed patrols are routine and unexploded landmines remain present in some areas \u2014 avoid off-road driving.","countryId":"kw","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"kw-fcdo-security","status":"ACTIVE","subcategory":"Border areas","title":"Illegal and dangerous to approach Kuwait's borders without authorisation"},

  "om-security-terrorism":{"category":"SECURITY","confidence":"MEDIUM","content":"Terrorist attacks in Oman cannot be ruled out and could target residential compounds, military, oil, transport and aviation interests, as well as restaurants and hotels.","countryId":"om","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"om-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Terrorist attacks cannot be ruled out"},
  "qa-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Emergency medical number: 999.","countryId":"qa","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"qa-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Emergency medical number: 999"},
  "qa-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"As a visitor, your passport must be valid for at least 6 months from the date you arrive.","countryId":"qa","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"qa-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport must be valid at least 6 months for visitors"},
  "qa-entry-transit":{"category":"ENTRY","confidence":"MEDIUM","content":"Transit passengers face strict drug policy \u2014 even residual/trace amounts can lead to arrest \u2014 and transit stays cannot exceed 24 hours.","countryId":"qa","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"qa-fcdo-entry","status":"ACTIVE","subcategory":"Other","title":"Transit passengers face strict drug policy, 24-hour limit"},
  "qa-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"Full British citizen passport holders can get a tourist visa on arrival; other passport types or non-tourism purposes need to apply in advance. Stays over 30 days require an extension via the Ministry of Interior before expiry.","countryId":"qa","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"qa-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Tourist visa on arrival for full British citizen passport holders"},
  "qa-health-quality":{"category":"HEALTH","confidence":"HIGH","content":"Healthcare facilities are similar to the UK, but visitors must pay for treatment \u2014 comprehensive travel health insurance with adequate coverage is essential.","countryId":"qa","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"qa-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Similar standard to the UK but payment required"},
  "qa-security-laws":{"category":"SECURITY","confidence":"HIGH","content":"Public drinking can mean up to 6 months' imprisonment; unmarried cohabitation, sex outside marriage and same-sex relations are illegal; drug possession has zero tolerance; photographing people without consent can mean imprisonment or fines up to 100,000 QAR; e-cigarettes are criminalised.","countryId":"qa","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"qa-fcdo-security","status":"ACTIVE","subcategory":"Public behaviour","title":"Severe penalties for alcohol, relationships, drugs, vaping, photography"},
  "qa-security-terrorism":{"category":"SECURITY","confidence":"MEDIUM","content":"Terrorist attacks in Qatar cannot be ruled out, with threats specifically mentioning Western interests including hotels, restaurants and shopping centres.","countryId":"qa","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"qa-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Attacks cannot be ruled out; Western-linked venues flagged"},
  "ru-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Dial 112 and ask for an ambulance.","countryId":"ru","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"ru-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Emergency number: 112"},
  "ru-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"A visa is required before travel, applied for in person at a visa application centre (London, Manchester or Edinburgh) to provide biometric data. This is only relevant to travellers who choose to go against FCDO advice.","countryId":"ru","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"The FCDO advises against all travel \u2014 see the SECURITY category.","reviewDate":"2027-03-17","sourceId":"ru-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa required in advance despite FCDO advising against all travel"},
  "ru-health-quality":{"category":"HEALTH","confidence":"HIGH","content":"Medical care in Russia may not meet Western standards. Hospitals may request payment before treatment, and in remote regions may not use disposable IV supplies/syringes/needles as standard practice.","countryId":"ru","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"ru-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"May not meet Western standards; bring own medical supplies in remote areas"},
  "ru-security-advisory":{"category":"SECURITY","confidence":"HIGH","content":"The FCDO advises against all travel to Russia. This reflects the ongoing war with Ukraine (drone attacks and explosions near the border and in major cities), heightened terrorism risk, and a legal environment in which foreigners can face lengthy imprisonment on limited grounds, with extremely limited UK consular ability to assist.","countryId":"ru","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least monthly given the conflict.","reviewDate":"2026-12-17","sourceId":"ru-fcdo-security","status":"ACTIVE","subcategory":"General security","title":"FCDO advises against all travel to Russia"},
  "ru-security-detention":{"category":"SECURITY","confidence":"HIGH","content":"Since December 2024 Russia has expanded liability for foreigners suspected of acting against Russian interests (e.g. displaying LGBT+ symbols, expressing support for Ukraine online). Dual British-Russian nationals are especially vulnerable, as Russian authorities may deny UK consular access to detainees.","countryId":"ru","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"ru-fcdo-security","status":"ACTIVE","subcategory":"Movement restrictions","title":"Expanded legal risk for foreigners, especially dual nationals"},
  "ru-security-terrorism":{"category":"SECURITY","confidence":"HIGH","content":"Terrorists are very likely to try to carry out attacks in Russia \u2014 the March 2024 Crocus City Hall attack near Moscow killed 145 people. Large gatherings, concerts and popular tourist sites are considered at risk.","countryId":"ru","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-17","sourceId":"ru-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Terrorists very likely to try to carry out attacks"},
