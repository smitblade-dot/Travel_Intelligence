    "tm-entry-currency": {"category": "ENTRY", "confidence": "MEDIUM", "content": "Turkmenistan operates primarily on cash (manat); USD and EUR exchange easily at official rates but bring clean, new bills. ATMs in Ashgabat charge 3% per withdrawal. Manat cannot be reconverted to foreign currency, and export of manat is restricted.", "countryId": "tm", "dataType": "CONSIDERATION", "dateChecked": "2026-09-17", "locationId": null, "notes": "Operationally significant for any personnel travel \u2014 arrange cash logistics before travel.", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-entry", "status": "ACTIVE", "subcategory": "Customs", "title": "Cash-based economy; manat cannot be reconverted"},
    "tm-entry-passport": {"category": "ENTRY", "confidence": "HIGH", "content": "Passport must have an expiry date at least 6 months after the planned departure date from Turkmenistan.", "countryId": "tm", "dataType": "REQUIREMENT", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-entry", "status": "ACTIVE", "subcategory": "Passport", "title": "Passport valid 6 months beyond planned departure"},
    "tm-entry-registration": {"category": "ENTRY", "confidence": "MEDIUM", "content": "Registration is required if staying over 3 working days, typically handled by hotels or sponsors. A migration fee ($14 USD) and daily tourism tax ($2 USD) apply.", "countryId": "tm", "dataType": "PROCEDURE", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-entry", "status": "ACTIVE", "subcategory": "Registration", "title": "Registration required for stays over 3 working days"},
    "tm-entry-visa": {"category": "ENTRY", "confidence": "HIGH", "content": "All visitors need a visa and a letter of invitation obtained beforehand (via a travel agent for tourism, or a company/ministry letter for business). Embassy applications take up to one month; visas on arrival are available at Ashgabat International Airport and select land borders. Transit visas (under 5 days) cannot be converted to tourist visas.", "countryId": "tm", "dataType": "REQUIREMENT", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-entry", "status": "ACTIVE", "subcategory": "Visa", "title": "Visa mandatory; letter of invitation required"},
    "tm-health-quality": {"category": "HEALTH", "confidence": "HIGH", "content": "The quality of medical care is poor and considerably more expensive than in the UK. Basic or emergency services outside the capital are best avoided. There is no reciprocal healthcare agreement with the UK.", "countryId": "tm", "dataType": "WARNING", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-health", "status": "ACTIVE", "subcategory": "Healthcare", "title": "Poor quality and expensive; no reciprocal agreement"},
    "tm-health-risks": {"category": "HEALTH", "confidence": "MEDIUM", "content": "Typhoid and hepatitis A are endemic. Summer temperatures regularly exceed 45\u00b0C, requiring hydration and sun protection. Air quality in cities fluctuates periodically.", "countryId": "tm", "dataType": "WARNING", "dateChecked": "2026-09-17", "locationId": null, "notes": "Extreme summer heat directly relevant to any outdoor gas-field work.", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-health", "status": "ACTIVE", "subcategory": "Health risks", "title": "Typhoid, hepatitis A, extreme summer heat"},
    "tm-health-water": {"category": "HEALTH", "confidence": "MEDIUM", "content": "Drink or use only boiled and filtered or bottled water and avoid ice in drinks.", "countryId": "tm", "dataType": "CONSIDERATION", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-health", "status": "ACTIVE", "subcategory": "Water safety", "title": "Only boiled/filtered or bottled water recommended"},
    "tm-security-driving": {"category": "TRANSPORT", "confidence": "MEDIUM", "content": "Driving conditions are hazardous outside urban areas, particularly at night, due to poor road conditions. Ashgabat enforces a 60 km/h speed limit via unmarked cameras. Use only licensed (white/green marked) taxis.", "countryId": "tm", "dataType": "CONSIDERATION", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-security", "status": "ACTIVE", "subcategory": "Road safety", "title": "Hazardous outside urban areas at night"},
    "tm-security-laws": {"category": "SECURITY", "confidence": "HIGH", "content": "VPNs are illegal and blocked. Negative political commentary on social media is treated as an offence. Alcohol consumption in public spaces carries 100-manat fines; drug possession results in lengthy prison sentences under basic conditions. Male same-sex activity is criminalised.", "countryId": "tm", "dataType": "WARNING", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "tm-fcdo-security", "status": "ACTIVE", "subcategory": "Local laws", "title": "VPNs illegal; strict alcohol and speech rules"},

    "us-entry-passport": {"category": "ENTRY", "confidence": "HIGH", "content": "Your passport must be valid for the length of your planned stay in the US; many transit countries separately require 6 months' remaining validity.", "countryId": "us", "dataType": "REQUIREMENT", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "us-fcdo-entry", "status": "ACTIVE", "subcategory": "Passport", "title": "Passport must be valid for the length of stay"},
    "us-health-cost": {"category": "HEALTH", "confidence": "HIGH", "content": "Medical treatment is expensive and there are no special arrangements for British visitors; some hospitals require deposits from non-residents. Comprehensive travel health insurance is essential.", "countryId": "us", "dataType": "WARNING", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "us-fcdo-health", "status": "ACTIVE", "subcategory": "Healthcare", "title": "Medical treatment is expensive with no special arrangements for visitors"},

    "us-security-naturaldisaster": {"category": "ENVIRONMENT", "confidence": "MEDIUM", "content": "Hurricane season runs June-November (Atlantic) and May-November (Pacific). Wildfires are prevalent in dry areas; earthquake risk is higher in Alaska, California, Hawaii, Oregon, Washington and Puerto Rico; tornadoes and flash floods can occur with minimal warning.", "countryId": "us", "dataType": "CONSIDERATION", "dateChecked": "2026-09-17", "locationId": null, "notes": "", "reviewDate": "2027-03-17", "sourceId": "us-fcdo-security", "status": "ACTIVE", "subcategory": "Seasonal hazards", "title": "Hurricanes, wildfires, tornadoes and earthquakes by region"},

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);

  // Recently-checked WARNING records (security escalations, changed entry
  // rules, etc.) plus any oil & gas country currently at Red/Amber worst
  // status — self-maintaining "what's live right now" feed. No separate
  // "hot" flag to keep updated by hand: it's just recency + severity over
  // data every weekly refresh already touches.
  // Two different data sources refresh on different cadences, so a single
  // flat sort-by-timestamp would let whichever one happened to run most
  // recently crowd the whole feed out (oil & gas dashboards vs. weekly
  // FCDO/Home Office checks). Instead: build each source's own ranked
  // list, then interleave — guarantees a genuine cross-section every time,
  // the way a briefing would actually mix "a security escalation" with
  // "a pipeline outage" rather than showing six of one kind.
  var CATEGORY_HOT_PRIORITY = {SECURITY:0, ENTRY:1, HEALTH:2, EMERGENCY:3};
  function computeHotspots(limit){
    limit = limit || 6;

    var warnings = [];
    allRecords.forEach(function(r){
      if(r.status !== 'ACTIVE' || r.dataType !== 'WARNING') return;
      var c = countries[r.countryId];
      if(!c) return;
      warnings.push({
        date: r.dateChecked || '',
        sev: 'red',
        country: c,
        badge: (CAT_MAP[r.category] && CAT_MAP[r.category].label) || r.category,
        title: r.title,
        snippet: r.content,
        pri: CATEGORY_HOT_PRIORITY.hasOwnProperty(r.category) ? CATEGORY_HOT_PRIORITY[r.category] : 9,
        go: function(){ openCountry(c.iso2, r.category); }
      });
    });
    warnings.sort(function(a,b){ return a.pri - b.pri || (b.date||'').localeCompare(a.date||''); });

    var ogHot = [];
    Object.keys(oilGasSummary).forEach(function(iso2){
      var c = countries[iso2];
      if(!c) return;
      var entry = oilGasSummary[iso2];
      ['crude','gas'].forEach(function(kind){
        var d = entry[kind];
        if(!d) return;
        var disruption = (d.active_disruptions||[])[0];
        // Skip generically "elevated" Amber statuses with no actual named
        // disruption — not newsworthy enough for the home page; Red always
        // qualifies since that means something is materially shut down.
        if(d.worst_status !== 'Red' && !(d.worst_status === 'Amber' && disruption)) return;
        ogHot.push({
          date: d.source_generated || '',
          sev: d.worst_status === 'Red' ? 'red' : 'amber',
          country: c,
          badge: (kind === 'crude' ? 'Crude' : 'Gas & LNG') + ' — ' + d.worst_status,
          title: disruption ? disruption.asset : (d.commodity || 'Oil & Gas'),
          snippet: disruption ? disruption.summary : 'Elevated infrastructure status — see the Oil & Gas tab for detail.',
          pri: d.worst_status === 'Red' ? 0 : 1,
          go: function(){ openCountry(c.iso2, 'OIL_GAS'); }
        });
      });
    });
    ogHot.sort(function(a,b){ return a.pri - b.pri || (b.date||'').localeCompare(a.date||''); });

    // Interleave the two ranked lists so the feed is always a mix.
    var items = [];
    var i = 0, j = 0;
    while(items.length < limit && (i < warnings.length || j < ogHot.length)){
      if(i < warnings.length){ items.push(warnings[i++]); if(items.length >= limit) break; }
      if(j < ogHot.length){ items.push(ogHot[j++]); }
    }
    return items.slice(0, limit);
  }

  function locationLabel(locId){
    if(!locId) return 'Country-wide';
    var loc = currentLocations[locId];
    if(!loc) return 'Specific location';
    var chain = [loc.name];
    var guard = 0;
    var parentId = loc.parentLocationId;
    while(parentId && guard < 6){
      var parent = currentLocations[parentId];
      if(!parent) break;
      chain.unshift(parent.name);
      parentId = parent.parentLocationId;
      guard++;
    }
    return chain.join(' › ') + (loc.type ? ' · ' + loc.type : '');
  }

  // Flat, depth-ordered list of a country's locations for tree UIs: top-level
  // locations first, each immediately followed by its descendants, indented.
  function locationTreeForCountry(iso2){
    var locs = locationsForCountry(iso2);
    var byId = locs;
    var childrenOf = {};
    Object.keys(locs).forEach(function(id){
      var pid = locs[id].parentLocationId || '';
      (childrenOf[pid] = childrenOf[pid] || []).push(id);
    });
    Object.keys(childrenOf).forEach(function(pid){
      childrenOf[pid].sort(function(a,b){ return (byId[a].name||'').localeCompare(byId[b].name||''); });
    });
    var out = [];
    function walk(pid, depth){
      (childrenOf[pid] || []).forEach(function(id){
        out.push({id:id, loc:byId[id], depth:depth});
        walk(id, depth + 1);
      });
    }
    walk('', 0);
    return out;
  }

    var records = currentRecords.filter(function(r){ return r.category === catKey && (isAdmin || r.status !== 'ARCHIVED'); });

      var order = {WARNING:0, REQUIREMENT:1, CONSIDERATION:2, CONTACT:3, PROCEDURE:4, STATISTIC:5, FACT:6};
      return (order[a.dataType]||9) - (order[b.dataType]||9);
    });

    if(isAdmin){
      wrap.appendChild(el('div', {class:'admin-row'}, [
        el('button', {class:'btn btn-accent btn-sm', onclick:function(){ openAddRecordModal(catKey); }}, ['+ Add record to ' + cat.label])
      ]));
    }

    if(records.length === 0){
      var empty = el('div', {class:'empty-state'}, [
        el('p', {}, ['No verified information recorded yet for ', el('strong',{},[cat.label]), ' in ' + c.name + '.']),
        el('p', {class:'empty-hint'}, ['Verify directly with the relevant authority before travelling.'])
      ]);
      if(isAdmin) empty.appendChild(el('button', {class:'btn btn-sm', onclick:function(){ openAddRecordModal(catKey); }}, ['+ Add the first record']));
      wrap.appendChild(empty);
      return wrap;
    }

    records.forEach(function(r){ wrap.appendChild(renderRecordCard(r)); });
    return wrap;
  }

  function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

  function openModal(title, bodyEl, onSave, saveLabel){
    var root = document.getElementById('modalRoot');
    var errorBox = el('div', {class:'form-error', hidden:true});
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target === backdrop) closeModal(); }});
    var modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, [title]));
    modal.appendChild(errorBox);
    modal.appendChild(bodyEl);
    var actions = el('div', {class:'modal-actions'});
    var cancelBtn = el('button', {class:'btn', onclick:closeModal}, ['Cancel']);
    var saveBtn = el('button', {class:'btn btn-accent', onclick:function(){
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      errorBox.hidden = true;
      Promise.resolve().then(onSave).then(function(){
        closeModal();
      }).catch(function(err){
        errorBox.textContent = (err && err.message) ? err.message : 'Could not save — please check the fields and try again.';
        errorBox.hidden = false;
        saveBtn.disabled = false; saveBtn.textContent = saveLabel || 'Save';
      });
    }}, [saveLabel || 'Save']);
    actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
    modal.appendChild(actions);
    backdrop.appendChild(modal);
    root.innerHTML = '';
    root.appendChild(backdrop);
  }

      var l = typeof opt === 'object' ? opt.label : opt;
      var o = el('option', {value:v}, [l]);

  /* ---- Location manager (nested tree: country → region/area → site) ---- */
  function openLocationManager(iso2){
    var c = countries[iso2];
    var root = document.getElementById('modalRoot');
    var editingId = null;

    function parentOptions(excludeId){
      var opts = [{v:'', label:'— No parent (top-level) —'}];
      locationTreeForCountry(iso2).forEach(function(node){
        if(node.id === excludeId) return;
        opts.push({v:node.id, label:'—'.repeat(node.depth) + (node.depth?' ':'') + node.loc.name});
      });
      return opts;
    }

    function viewRow(node){
      var row = el('div', {class:'loc-row', style:'margin-inline-start:' + (node.depth*18) + 'px'});
      row.appendChild(el('span', {class:'loc-name'}, [node.loc.name]));
      row.appendChild(el('span', {class:'loc-type'}, [node.loc.type]));
      if(db){
        row.appendChild(el('div', {class:'loc-actions'}, [
          el('button', {class:'btn btn-sm', onclick:function(){ editingId = node.id; rebuild(); }}, ['Edit']),
          deleteButton(function(){
            db.doc('locations/' + node.id).delete().then(rebuild).catch(showGlobalError);
          })
        ]));
      }
      return row;
    }

    function editRow(node){
      var row = el('div', {class:'loc-row', style:'margin-inline-start:' + (node.depth*18) + 'px; flex-wrap:wrap;'});
      var nameInput = input('', node.loc.name);
      var typeSelect = select('', LOCATION_TYPES, node.loc.type);
      var parentSelect = select('', parentOptions(node.id), node.loc.parentLocationId || '');
      row.appendChild(nameInput);
      row.appendChild(typeSelect);
      row.appendChild(parentSelect);
      row.appendChild(el('div', {class:'loc-actions'}, [
        el('button', {class:'btn btn-sm btn-accent', onclick:function(){
          var name = nameInput.value.trim();
          if(!name) return;
          db.doc('locations/' + node.id).update({
            name: name, type: typeSelect.value, parentLocationId: parentSelect.value || null, updatedAt: new Date().toISOString()
          }).then(function(){ editingId = null; rebuild(); }).catch(showGlobalError);
        }}, ['Save']),
        el('button', {class:'btn btn-sm', onclick:function(){ editingId = null; rebuild(); }}, ['Cancel'])
      ]));
      return row;
    }

    function rebuild(){
      var body = el('div');
      body.appendChild(el('p', {class:'hint'}, ['Locations nest under one another — a SITE can sit inside a REMOTE_AREA inside a country, for example. Records can then be scoped to the exact place they apply to.']));
      var treeWrap = el('div', {class:'loc-tree'});
      var nodes = locationTreeForCountry(iso2);
      if(!nodes.length){
        treeWrap.appendChild(el('div', {class:'loc-empty'}, ['No locations recorded yet for ' + (c?c.name:iso2) + '.']));
      } else {
        nodes.forEach(function(node){
          treeWrap.appendChild(editingId === node.id ? editRow(node) : viewRow(node));
        });
      }
      body.appendChild(treeWrap);

      if(db){
        var addName = input('', '', 'e.g. Erbil');
        var addType = select('', LOCATION_TYPES, 'CITY');
        var addParent = select('', parentOptions(null), '');
        body.appendChild(el('div', {class:'field-row'}, [
          field('New location name', addName),
          field('Type', addType)
        ]));
        body.appendChild(field('Parent (optional)', addParent));
        body.appendChild(el('button', {class:'btn btn-sm btn-accent', onclick:function(){
          var name = addName.value.trim();
          if(!name) return;
          db.collection('locations').add({
            countryId: iso2, name: name, type: addType.value, parentLocationId: addParent.value || null,
            status: 'ACTIVE', updatedAt: new Date().toISOString()
          }).then(rebuild).catch(showGlobalError);
        }}, ['+ Add location']));
      } else {
        body.appendChild(el('div', {class:'hint'}, ["Live editing isn't available in this view right now — this list is read-only until it reconnects."]));
      }

      root.innerHTML = '';
      var errorBox = el('div', {class:'form-error', hidden:true});
      var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target === backdrop) closeModal(); }});
      var modal = el('div', {class:'modal'});
      modal.appendChild(el('h2', {}, ['Manage locations — ' + (c?c.name:iso2)]));
      modal.appendChild(errorBox);
      modal.appendChild(body);
      var actions = el('div', {class:'modal-actions'});
      actions.appendChild(el('button', {class:'btn btn-accent', onclick:closeModal}, ['Done']));
      modal.appendChild(actions);
      backdrop.appendChild(modal);
      root.appendChild(backdrop);
    }

    rebuild();
  }

  /* ============================= BOOT ============================= */

  document.getElementById('searchInput').addEventListener('input', function(e){
    searchTerm = e.target.value;
    if(!currentIso2) render();
  });
  document.getElementById('brandHomeBtn').addEventListener('click', goHome);

  // Show real content immediately from the embedded saved copy — never an empty shell.
  setStatus(Object.keys(countries).length + ' countries (saved copy)');
  setDataAsOf('<span class="dot"></span> Loading latest data…');
  render();

  function fmtGenerated(iso){
    if(!iso) return 'unknown';
    try{
      var dt = new Date(iso);
      if(isNaN(dt.getTime())) return iso;
      return dt.toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'UTC'}) + ' UTC';
    }catch(e){ return iso; }
  }

  fetch('./data.json', {cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(data){
    var cMap = {};
    Object.keys(data.countries || {}).forEach(function(k){ var d = data.countries[k]; d.iso2 = k; cMap[k] = d; });
    countries = cMap;
    allRecords = Object.keys(data.records || {}).map(function(k){ var d = data.records[k]; d.id = k; return d; });
    allSources = data.sources || {};
    allLocations = data.locations || {};
    oilGasSummary = data.oilGasSummary || {};
    usingLiveDb = true;
    dbState = 'connected';
    setStatus(Object.keys(countries).length + ' countries on file');
    setDataAsOf('<span class="dot"></span> <b>Data as of ' + fmtGenerated(data.meta && data.meta.generated) + '</b>');
    refreshCurrentCountryData();
    render();
  }).catch(function(err){
    dbState = 'unavailable';
    setStatus(Object.keys(countries).length + ' countries (saved copy)');
    setDataAsOf('<span class="dot"></span> Could not load latest data — showing the last saved copy (' + (err && err.message ? err.message : 'unknown error') + ')', true);
    render();
  });

})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js').catch(function(){ /* PWA install just won't be available — page still works */ });
  });
}
</script>
</body>
