  "sa-entry-israel":{"category":"ENTRY","confidence":"HIGH","content":"You may not be allowed to enter Saudi Arabia if your passport shows that you have travelled to, or were born in, Israel.","countryId":"sa","dataType":"CONSIDERATION","dateChecked":"2026-09-16","locationId":null,"notes":"","reviewDate":"2027-03-16","sourceId":"sa-fcdo-entry","status":"ACTIVE","subcategory":"Other","title":"Entry may be refused for prior travel to, or birth in, Israel","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must remain valid for at least 6 months beyond your arrival date in Saudi Arabia. You will not be permitted entry if your passport has been reported lost or stolen.","countryId":"sa","dataType":"REQUIREMENT","dateChecked":"2026-09-16","locationId":null,"notes":"Stated for British nationals; verify equivalent rule for other nationalities.","reviewDate":"2027-03-16","sourceId":"sa-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport must be valid at least 6 months beyond arrival","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-entry-transit":{"category":"ENTRY","confidence":"MEDIUM","content":"A transit visa is required if you will pass through Saudi immigration, are travelling on separate tickets, or have a layover exceeding 12 hours. Overland travellers via the Bahrain causeway should verify their visa permits that route.","countryId":"sa","dataType":"REQUIREMENT","dateChecked":"2026-09-16","locationId":null,"notes":"","reviewDate":"2027-03-16","sourceId":"sa-fcdo-entry","status":"ACTIVE","subcategory":"Other","title":"Transit visa needed for some layovers","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"A visa is required. Electronic Travel Authorisation (ETA): tourism, business, study, medical treatment or Umrah outside Hajj season; valid 730 days, multiple entries, 180 days total, no health insurance included. E-Visa: tourists only; valid 365 days, multiple entries, 90 days total, includes health insurance cover up to 100,000 SAR. Electronic Visa Waiver: tourism, business, medical treatment, study or Umrah; single entry, up to 180 days, apply 48 hours to 90 days before travel, no health insurance included.","countryId":"sa","dataType":"REQUIREMENT","dateChecked":"2026-09-16","locationId":null,"notes":"Stated for British nationals \u2014 requirements vary by nationality.","reviewDate":"2027-03-16","sourceId":"sa-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa required \u2014 three route options depending on purpose","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-health-hajj-heat":{"category":"HEALTH","confidence":"MEDIUM","content":"Heat stroke and dehydration are a real risk during the summer months. Contagious diseases can spread rapidly, particularly during Hajj and Ramadan when very large crowds gather.","countryId":"sa","dataType":"CONSIDERATION","dateChecked":"2026-09-16","locationId":null,"notes":"","reviewDate":"2027-03-16","sourceId":"sa-fcdo-health","status":"ACTIVE","subcategory":"General health","title":"Heat, dehydration and contagious disease risk","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-health-medication":{"category":"HEALTH","confidence":"HIGH","content":"Some UK prescription and over-the-counter medicines are controlled substances in Saudi Arabia. If you need to bring medication, carry official documentation from your doctor stating the amount prescribed and drug/dosage details. A UK prescription is not valid locally \u2014 only a Saudi-licensed doctor can issue a prescription there.","countryId":"sa","dataType":"WARNING","dateChecked":"2026-09-16","locationId":null,"notes":"","reviewDate":"2027-03-16","sourceId":"sa-fcdo-health","status":"ACTIVE","subcategory":"Medication","title":"Some UK medicines are controlled substances in Saudi Arabia","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-health-quality":{"category":"HEALTH","confidence":"HIGH","content":"Healthcare facilities in major Saudi cities are of a high standard. Most towns have health centres or basic hospitals, though serious cases may require transfer to a major city.","countryId":"sa","dataType":"FACT","dateChecked":"2026-09-16","locationId":null,"notes":"","reviewDate":"2027-03-16","sourceId":"sa-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"High-standard healthcare in major cities","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-health-vaccinations":{"category":"HEALTH","confidence":"MEDIUM","content":"Check the latest vaccine recommendations for Saudi Arabia at least 8 weeks before travel via TravelHealthPro or the NHS travel vaccinations service. Proof of yellow fever vaccination is required if arriving from an endemic area, and the meningococcal quadrivalent vaccine is required for Hajj/Umrah pilgrims.","countryId":"sa","dataType":"CONSIDERATION","dateChecked":"2026-09-16","locationId":null,"notes":"","reviewDate":"2027-03-16","sourceId":"sa-fcdo-health","status":"ACTIVE","subcategory":"Vaccinations","title":"Check current vaccine recommendations before travel","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-security-facilities":{"category":"SECURITY","confidence":"MEDIUM","content":"Avoid the vicinity of security and military facilities, which have been targeted in the past. Travel insurance may be invalidated if you travel against FCDO advice, so check your policy against the current advice before travelling.","countryId":"sa","dataType":"CONSIDERATION","dateChecked":"2026-09-16","locationId":null,"notes":"","reviewDate":"2027-03-16","sourceId":"sa-fcdo-general","status":"ACTIVE","subcategory":"Movement restrictions","title":"Stay away from security and military facilities","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-security-regional-tension":{"category":"SECURITY","confidence":"HIGH","content":"There is a risk of escalating Middle East conflict, including strikes and retaliatory attacks involving Iran, and Houthi attacks on Saudi territory and infrastructure. The Houthis have attacked Saudi Arabia before and could do so again at short notice, including airports and ports in Riyadh, Jeddah and Abha. Expect possible flight cancellations and periodic airspace closures.","countryId":"sa","dataType":"WARNING","dateChecked":"2026-09-16","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-16","sourceId":"sa-fcdo-general","status":"ACTIVE","subcategory":"Conflict","title":"Risk of regional escalation, including Houthi attacks","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sa-security-yemen-border":{"category":"SECURITY","confidence":"HIGH","content":"The FCDO advises against all travel within 10km of the Saudi\u2013Yemen border, and against all but essential travel between 10\u201380km of it, due to the ongoing regional conflict.","countryId":"sa","dataType":"WARNING","dateChecked":"2026-09-16","locationId":"loc-sa-yemen-border","notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-16","sourceId":"sa-fcdo-general","status":"ACTIVE","subcategory":"Border areas","title":"Avoid all travel within 10km of the Yemen border","updatedAt":"2026-09-16T00:00:00.000Z"},
  "sy-entry-advice-against":{"category":"ENTRY","confidence":"HIGH","content":"The FCDO advises against all travel to Syria, making the published entry requirements largely theoretical; rules should be verified directly with Syrian authorities given the ongoing political transition.","countryId":"sy","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"sy-fcdo-entry","status":"ACTIVE","subcategory":"Travel advisory","title":"FCDO advises against all travel to Syria"},
  "sy-entry-visa":{"category":"ENTRY","confidence":"MEDIUM","content":"A visa is mandatory, applied for online, typically taking approximately 5-7 days to process though this can vary; passports must be valid for at least 3 months after the date of arrival. Israeli and Iranian citizens cannot enter, and travellers with Israeli stamps in their passport may be refused entry.","countryId":"sy","dataType":"REQUIREMENT","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"sy-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa mandatory; entry barred for Israeli/Iranian citizens"},
  "sy-security-kidnap":{"category":"SECURITY","confidence":"HIGH","content":"There is a very high threat of kidnapping from terrorists throughout Syria, including Al-Qaeda-affiliated groups and Daesh. British nationals are explicitly targeted and some hostages have been killed.","countryId":"sy","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"sy-fcdo-security","status":"ACTIVE","subcategory":"Kidnap","title":"Very high kidnap threat; British nationals targeted"},
  "sy-security-ordnance":{"category":"SECURITY","confidence":"MEDIUM","content":"Landmines and other unexploded ordnance remain from the Syrian conflict, with particular risk in less populated and rural areas and near former conflict lines.","countryId":"sy","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"","reviewDate":"2027-03-21","sourceId":"sy-fcdo-security","status":"ACTIVE","subcategory":"Landmines","title":"Landmine and unexploded ordnance risk"},
  "sy-security-terrorism":{"category":"SECURITY","confidence":"HIGH","content":"Terrorists are very likely to try to carry out attacks in Syria. Daesh continues to carry out regular attacks nationwide, including in Damascus \u2014 recent incidents include an explosives attack on the Four Seasons hotel and Tourism Ministry (7 July 2026, 1 killed, 36 injured), a caf\u00e9 bombing in central Damascus (2 July 2026, 9 killed, 22 injured), and an attack on a Greek Orthodox church (2 June 2025, at least 30 killed).","countryId":"sy","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"sy-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"Regular Daesh attacks nationwide, including Damascus"},
  "sy-security-transition":{"category":"SECURITY","confidence":"HIGH","content":"The security situation remains volatile following the fall of the Assad government; fighting and violence may occur around the country. Some areas, particularly Suwayda province, are controlled by local armed groups rather than the Syrian government.","countryId":"sy","dataType":"WARNING","dateChecked":"2026-09-21","locationId":null,"notes":"Fast-changing \u2014 review at least quarterly.","reviewDate":"2026-12-21","sourceId":"sy-fcdo-security","status":"ACTIVE","subcategory":"Political transition","title":"Volatile situation post-Assad; some areas outside government control"},
  "tm-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Ambulance: 03 from landline, 003 from mobile. Fire: 01 landline / 001 mobile. Police: 02 landline / 002 mobile.","countryId":"tm","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"tm-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Ambulance: 03 (landline) / 003 (mobile)"},
  "tm-entry-currency":{"category":"ENTRY","confidence":"MEDIUM","content":"Turkmenistan operates primarily on cash (manat); USD and EUR exchange easily at official rates but bring clean, new bills. ATMs in Ashgabat charge 3% per withdrawal. Manat cannot be reconverted to foreign currency, and export of manat is restricted.","countryId":"tm","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"Operationally significant for any personnel travel \u2014 arrange cash logistics before travel.","reviewDate":"2027-03-17","sourceId":"tm-fcdo-entry","status":"ACTIVE","subcategory":"Customs","title":"Cash-based economy; manat cannot be reconverted"},
  "tm-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Passport must have an expiry date at least 6 months after the planned departure date from Turkmenistan.","countryId":"tm","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport valid 6 months beyond planned departure"},
  "tm-entry-registration":{"category":"ENTRY","confidence":"MEDIUM","content":"Registration is required if staying over 3 working days, typically handled by hotels or sponsors. A migration fee ($14 USD) and daily tourism tax ($2 USD) apply.","countryId":"tm","dataType":"PROCEDURE","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-entry","status":"ACTIVE","subcategory":"Registration","title":"Registration required for stays over 3 working days"},
  "tm-entry-visa":{"category":"ENTRY","confidence":"HIGH","content":"All visitors need a visa and a letter of invitation obtained beforehand (via a travel agent for tourism, or a company/ministry letter for business). Embassy applications take up to one month; visas on arrival are available at Ashgabat International Airport and select land borders. Transit visas (under 5 days) cannot be converted to tourist visas.","countryId":"tm","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-entry","status":"ACTIVE","subcategory":"Visa","title":"Visa mandatory; letter of invitation required"},
  "tm-health-quality":{"category":"HEALTH","confidence":"HIGH","content":"The quality of medical care is poor and considerably more expensive than in the UK. Basic or emergency services outside the capital are best avoided. There is no reciprocal healthcare agreement with the UK.","countryId":"tm","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Poor quality and expensive; no reciprocal agreement"},
  "tm-health-risks":{"category":"HEALTH","confidence":"MEDIUM","content":"Typhoid and hepatitis A are endemic. Summer temperatures regularly exceed 45\u00b0C, requiring hydration and sun protection. Air quality in cities fluctuates periodically.","countryId":"tm","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Extreme summer heat directly relevant to any outdoor gas-field work.","reviewDate":"2027-03-17","sourceId":"tm-fcdo-health","status":"ACTIVE","subcategory":"Health risks","title":"Typhoid, hepatitis A, extreme summer heat"},
  "tm-health-water":{"category":"HEALTH","confidence":"MEDIUM","content":"Drink or use only boiled and filtered or bottled water and avoid ice in drinks.","countryId":"tm","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-health","status":"ACTIVE","subcategory":"Water safety","title":"Only boiled/filtered or bottled water recommended"},
  "tm-security-driving":{"category":"TRANSPORT","confidence":"MEDIUM","content":"Driving conditions are hazardous outside urban areas, particularly at night, due to poor road conditions. Ashgabat enforces a 60 km/h speed limit via unmarked cameras. Use only licensed (white/green marked) taxis.","countryId":"tm","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-security","status":"ACTIVE","subcategory":"Road safety","title":"Hazardous outside urban areas at night"},
  "tm-security-laws":{"category":"SECURITY","confidence":"HIGH","content":"VPNs are illegal and blocked. Negative political commentary on social media is treated as an offence. Alcohol consumption in public spaces carries 100-manat fines; drug possession results in lengthy prison sentences under basic conditions. Male same-sex activity is criminalised.","countryId":"tm","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-security","status":"ACTIVE","subcategory":"Local laws","title":"VPNs illegal; strict alcohol and speech rules"},
  "tm-security-restrictions":{"category":"SECURITY","confidence":"HIGH","content":"Border areas near Afghanistan and Iran are tightly restricted with occasional unannounced closures. Photography of airports, military sites, police stations, government buildings and embassies is prohibited without permission.","countryId":"tm","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"Relevant for any gas-field travel near restricted border zones.","reviewDate":"2027-03-17","sourceId":"tm-fcdo-security","status":"ACTIVE","subcategory":"Movement restrictions","title":"Border areas restricted; photography of official sites banned"},
  "tm-security-terrorism":{"category":"SECURITY","confidence":"MEDIUM","content":"Although there is no recent history of terrorism in Turkmenistan, attacks cannot be ruled out given the broader global terrorism threat affecting British interests.","countryId":"tm","dataType":"CONSIDERATION","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"tm-fcdo-security","status":"ACTIVE","subcategory":"Terrorism","title":"No recent history but attacks cannot be ruled out"},
  "us-emergency-ambulance":{"category":"EMERGENCY","confidence":"HIGH","content":"Dial 911 and ask for an ambulance.","countryId":"us","dataType":"CONTACT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-09-17","sourceId":"us-fcdo-health","status":"ACTIVE","subcategory":"Ambulance","title":"Emergency number: 911"},
  "us-entry-esta":{"category":"ENTRY","confidence":"HIGH","content":"Travellers need either an approved ESTA (Visa Waiver Program) or a US visa before arrival \u2014 a valid ESTA/visa does not guarantee entry. You cannot use ESTA if you have prior arrests/convictions, were previously deported or refused entry, overstayed a past ESTA, or have travelled to Iran, Iraq, Libya, North Korea, Somalia, Sudan, Syria or Yemen since March 2011, or Cuba since 12 Jan 2021.","countryId":"us","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"Relevant for oil & gas travellers with Middle East travel history \u2014 check ESTA eligibility carefully.","reviewDate":"2027-03-17","sourceId":"us-fcdo-entry","status":"ACTIVE","subcategory":"eVisa","title":"ESTA or visa required before travel; ineligibility triggers"},
  "us-entry-passport":{"category":"ENTRY","confidence":"HIGH","content":"Your passport must be valid for the length of your planned stay in the US; many transit countries separately require 6 months' remaining validity.","countryId":"us","dataType":"REQUIREMENT","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"us-fcdo-entry","status":"ACTIVE","subcategory":"Passport","title":"Passport must be valid for the length of stay"},
  "us-health-cost":{"category":"HEALTH","confidence":"HIGH","content":"Medical treatment is expensive and there are no special arrangements for British visitors; some hospitals require deposits from non-residents. Comprehensive travel health insurance is essential.","countryId":"us","dataType":"WARNING","dateChecked":"2026-09-17","locationId":null,"notes":"","reviewDate":"2027-03-17","sourceId":"us-fcdo-health","status":"ACTIVE","subcategory":"Healthcare","title":"Medical treatment is expensive with no special arrangements for visitors"},

  /* ============================= HELPERS ============================= */

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function flagEmoji(iso2){
    if(!iso2 || iso2.length !== 2) return '🏳️';
    var cc = iso2.toUpperCase();
    try{
      return String.fromCodePoint(0x1F1E6 + cc.charCodeAt(0) - 65, 0x1F1E6 + cc.charCodeAt(1) - 65);
    }catch(e){ return '🏳️'; }
  }
  function fmtDate(d){
    if(!d) return '—';
    try{
      var dt = new Date(d);
      if(isNaN(dt.getTime())) return d;
      return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
    }catch(e){ return d; }
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }

    el.classList.toggle('stale', !!stale);
  }

  function visibleCountryList(){
    var list = Object.keys(countries).map(function(k){ return countries[k]; }).sort(byName);
    var term = searchTerm.trim().toLowerCase();
    if(term){
      list = list.filter(function(c){
        return (c.name||'').toLowerCase().indexOf(term) >= 0 ||
               (c.capital||'').toLowerCase().indexOf(term) >= 0 ||
               (c.region||'').toLowerCase().indexOf(term) >= 0 ||
               (c.subregion||'').toLowerCase().indexOf(term) >= 0;
      });
    }
    if(!isAdmin) list = list.filter(function(c){ return c.status !== 'ARCHIVED'; });
    return list;

  // Recently-checked WARNING records (security escalations, changed entry
  // rules, environmental hazards, etc.) — self-maintaining "what's live
  // right now" feed. No separate "hot" flag to keep updated by hand: it's
  // just recency + severity over data every refresh already touches.
  var CATEGORY_HOT_PRIORITY = {SECURITY:0, ENTRY:1, ENVIRONMENT:2, HEALTH:3, EMERGENCY:4};
  function computeHotspots(limit){
    limit = limit || 6;
    var warnings = [];
    allRecords.forEach(function(r){
      if(r.status !== 'ACTIVE' || r.dataType !== 'WARNING') return;
      var c = countries[r.countryId];
      if(!c) return;
      warnings.push({
        date: r.dateChecked || '',
        country: c,
        badge: (CAT_MAP[r.category] && CAT_MAP[r.category].label) || r.category,
        title: r.title,
        snippet: r.content,
        pri: CATEGORY_HOT_PRIORITY.hasOwnProperty(r.category) ? CATEGORY_HOT_PRIORITY[r.category] : 9,
        go: function(){ openCountry(c.iso2, r.category); }
      });
    });
    warnings.sort(function(a,b){ return a.pri - b.pri || (b.date||'').localeCompare(a.date||''); });
    return warnings.slice(0, limit);
  }

  function ciSourceForEvent(event){
    var ids=[];
    (allSourceObservations||[]).forEach(function(o){ if(o.eventId===event.id && o.sourceId) ids.push(o.sourceId); });
    for(var i=0;i<ids.length;i++){ if(allSources[ids[i]]) return allSources[ids[i]]; }
    return null;
  }
  function ciIndependentGroups(event){
    var independent=new Set();
    (allSourceObservations||[]).forEach(function(o){
      if(o.eventId===event.id && o.independenceGroupId) independent.add(o.independenceGroupId);
    });
    return independent;
  }

  function ciObservationsForEvent(event){
    return (allSourceObservations||[]).filter(function(o){ return o.eventId===event.id; });
  }

  function ciSourceForEvent(event){
    var obs=ciObservationsForEvent(event);
    for(var i=0;i<obs.length;i++){
      if(obs[i].sourceId && allSources[obs[i].sourceId]) return allSources[obs[i].sourceId];
    }
    return null;
  }

  function ciEventImpact(event){
    var impact=event.impactType || event.operationalImpact || '';
    return Array.isArray(impact) ? impact.join(' · ') : String(impact);

  function currentEventCard(event){
    var source=ciSourceForEvent(event);
    var independent=ciIndependentGroups(event);
    var c=event.countryId && countries[event.countryId] ? countries[event.countryId] : null;
    var title=event.title || event.name || 'Current intelligence event';
    var summary=event.summary || event.description || event.extractedClaim || '';
    var status=event.eventStatus || 'REPORTED';
    var impact=ciEventImpact(event);
    var sourceName=source ? (source.sourceName || source.organisation || 'Source') : 'Source attribution pending';
    var meta=[];
    if(c) meta.push(c.name);
    if(event.eventDate) meta.push(fmtDate(event.eventDate));
    if(event.lastUpdated) meta.push('Updated '+fmtDate(event.lastUpdated));
    var statusClass='ci-status-'+String(status).toLowerCase().replace(/_/g,'-');
    var card=el('article',{class:'ci-card '+statusClass,tabindex:'0',role:'button','aria-label':'Open '+title},[
      el('div',{class:'ci-top'},[
        el('span',{class:'ci-status'},[status.replace(/_/g,' ')]),
        impact ? el('span',{class:'ci-impact'},[impact.replace(/_/g,' ')]) : null
      ]),
      el('div',{class:'ci-title'},[title]),
      el('div',{class:'ci-summary'},[summary]),
      el('div',{class:'ci-meta'},[el('span',{class:'ci-source'},[sourceName])].concat(meta.map(function(x){return el('span',{},[x]);}))),
      independent.size <= 1 ? el('div',{class:'ci-caveat'},['Single reporting chain — TI has not independently corroborated this event through a second source.']) : null
    ]);
    card.addEventListener('click',function(){ openCurrentEventModal(event); });
    card.addEventListener('keydown',function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openCurrentEventModal(event); } });
    return card;

  function openCurrentEventModal(event){

  function locationLabel(locId){
    if(!locId) return 'Country-wide';
    var loc = currentLocations[locId];
    if(!loc) return 'Specific location';
    var chain = [loc.name];
    var guard = 0;
    var parentId = loc.parentLocationId;
    while(parentId && guard < 6){
      var parent = currentLocations[parentId];
      if(!parent) break;
      chain.unshift(parent.name);
      parentId = parent.parentLocationId;
      guard++;
    }
    return chain.join(' › ') + (loc.type ? ' · ' + loc.type : '');
  }

  // Flat, depth-ordered list of a country's locations for tree UIs: top-level
  // locations first, each immediately followed by its descendants, indented.
  function locationTreeForCountry(iso2){
    var locs = locationsForCountry(iso2);
    var byId = locs;
    var childrenOf = {};
    Object.keys(locs).forEach(function(id){
      var pid = locs[id].parentLocationId || '';
      (childrenOf[pid] = childrenOf[pid] || []).push(id);
    });
    Object.keys(childrenOf).forEach(function(pid){
      childrenOf[pid].sort(function(a,b){ return (byId[a].name||'').localeCompare(byId[b].name||''); });
    });
    var out = [];
    function walk(pid, depth){
      (childrenOf[pid] || []).forEach(function(id){
        out.push({id:id, loc:byId[id], depth:depth});
        walk(id, depth + 1);
      });
    }
    walk('', 0);
    return out;
  }

  function openModal(title, bodyEl, onSave, saveLabel){
    var root = document.getElementById('modalRoot');
    var errorBox = el('div', {class:'form-error', hidden:true});
    var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target === backdrop) closeModal(); }});
    var modal = el('div', {class:'modal'});
    modal.appendChild(el('h2', {}, [title]));
    modal.appendChild(errorBox);
    modal.appendChild(bodyEl);
    var actions = el('div', {class:'modal-actions'});
    var cancelBtn = el('button', {class:'btn', onclick:closeModal}, ['Cancel']);
    var saveBtn = el('button', {class:'btn btn-accent', onclick:function(){
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      errorBox.hidden = true;
      Promise.resolve().then(onSave).then(function(){
        closeModal();
      }).catch(function(err){
        errorBox.textContent = (err && err.message) ? err.message : 'Could not save — please check the fields and try again.';
        errorBox.hidden = false;
        saveBtn.disabled = false; saveBtn.textContent = saveLabel || 'Save';
      });
    }}, [saveLabel || 'Save']);
    actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
    modal.appendChild(actions);
    backdrop.appendChild(modal);
    root.innerHTML = '';
    root.appendChild(backdrop);
  }

  /* ---- Location manager (nested tree: country → region/area → site) ---- */
  function openLocationManager(iso2){
    var c = countries[iso2];
    var root = document.getElementById('modalRoot');
    var editingId = null;

    function parentOptions(excludeId){
      var opts = [{v:'', label:'— No parent (top-level) —'}];
      locationTreeForCountry(iso2).forEach(function(node){
        if(node.id === excludeId) return;
        opts.push({v:node.id, label:'—'.repeat(node.depth) + (node.depth?' ':'') + node.loc.name});
      });
      return opts;
    }

    function viewRow(node){
      var row = el('div', {class:'loc-row', style:'margin-inline-start:' + (node.depth*18) + 'px'});
      row.appendChild(el('span', {class:'loc-name'}, [node.loc.name]));
      row.appendChild(el('span', {class:'loc-type'}, [node.loc.type]));
      if(db){
        row.appendChild(el('div', {class:'loc-actions'}, [
          el('button', {class:'btn btn-sm', onclick:function(){ editingId = node.id; rebuild(); }}, ['Edit']),
          deleteButton(function(){
            db.doc('locations/' + node.id).delete().then(rebuild).catch(showGlobalError);
          })
        ]));
      }
      return row;
    }

    function editRow(node){
      var row = el('div', {class:'loc-row', style:'margin-inline-start:' + (node.depth*18) + 'px; flex-wrap:wrap;'});
      var nameInput = input('', node.loc.name);
      var typeSelect = select('', LOCATION_TYPES, node.loc.type);
      var parentSelect = select('', parentOptions(node.id), node.loc.parentLocationId || '');
      row.appendChild(nameInput);
      row.appendChild(typeSelect);
      row.appendChild(parentSelect);
      row.appendChild(el('div', {class:'loc-actions'}, [
        el('button', {class:'btn btn-sm btn-accent', onclick:function(){
          var name = nameInput.value.trim();
          if(!name) return;
          db.doc('locations/' + node.id).update({
            name: name, type: typeSelect.value, parentLocationId: parentSelect.value || null, updatedAt: new Date().toISOString()
          }).then(function(){ editingId = null; rebuild(); }).catch(showGlobalError);
        }}, ['Save']),
        el('button', {class:'btn btn-sm', onclick:function(){ editingId = null; rebuild(); }}, ['Cancel'])
      ]));
      return row;
    }

    function rebuild(){
      var body = el('div');
      body.appendChild(el('p', {class:'hint'}, ['Locations nest under one another — a SITE can sit inside a REMOTE_AREA inside a country, for example. Records can then be scoped to the exact place they apply to.']));
      var treeWrap = el('div', {class:'loc-tree'});
      var nodes = locationTreeForCountry(iso2);
      if(!nodes.length){
        treeWrap.appendChild(el('div', {class:'loc-empty'}, ['No locations recorded yet for ' + (c?c.name:iso2) + '.']));
      } else {
        nodes.forEach(function(node){
          treeWrap.appendChild(editingId === node.id ? editRow(node) : viewRow(node));
        });
      }
      body.appendChild(treeWrap);

      if(db){
        var addName = input('', '', 'e.g. Erbil');
        var addType = select('', LOCATION_TYPES, 'CITY');
        var addParent = select('', parentOptions(null), '');
        body.appendChild(el('div', {class:'field-row'}, [
          field('New location name', addName),
          field('Type', addType)
        ]));
        body.appendChild(field('Parent (optional)', addParent));
        body.appendChild(el('button', {class:'btn btn-sm btn-accent', onclick:function(){
          var name = addName.value.trim();
          if(!name) return;
          db.collection('locations').add({
            countryId: iso2, name: name, type: addType.value, parentLocationId: addParent.value || null,
            status: 'ACTIVE', updatedAt: new Date().toISOString()
          }).then(rebuild).catch(showGlobalError);
        }}, ['+ Add location']));
      } else {
        body.appendChild(el('div', {class:'hint'}, ["Live editing isn't available in this view right now — this list is read-only until it reconnects."]));
      }

      root.innerHTML = '';
      var errorBox = el('div', {class:'form-error', hidden:true});
      var backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target === backdrop) closeModal(); }});
      var modal = el('div', {class:'modal'});
      modal.appendChild(el('h2', {}, ['Manage locations — ' + (c?c.name:iso2)]));
      modal.appendChild(errorBox);
      modal.appendChild(body);
      var actions = el('div', {class:'modal-actions'});
      actions.appendChild(el('button', {class:'btn btn-accent', onclick:closeModal}, ['Done']));
      modal.appendChild(actions);
      backdrop.appendChild(modal);
      root.appendChild(backdrop);
    }

    rebuild();
  }

  function fmtGenerated(iso){
    if(!iso) return 'unknown';
    try{
      var dt = new Date(iso);
      if(isNaN(dt.getTime())) return iso;
      return dt.toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'UTC'}) + ' UTC';
    }catch(e){ return iso; }
  }

  fetch('./data.json', {cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(data){
    var cMap = {};
    Object.keys(data.countries || {}).forEach(function(k){
      var d = data.countries[k];
      // Live exports may serialise the countries collection as a numeric-keyed
      // object. Country identity is the ISO2/id field, which must remain the
      // join key for records, sources, locations and events.
      var iso2 = d && (d.iso2 || d.id);
      if(!iso2) iso2 = k;
      d.iso2 = String(iso2).toLowerCase();
      cMap[d.iso2] = d;
    });
    countries = cMap;
    allRecords = Object.keys(data.records || {}).map(function(k){ var d = data.records[k]; d.id = k; return d; });
    // Normalise exported collections to the ID-keyed maps used by the UI.
    // data.json may serialise these collections as numeric-keyed objects while
    // each object retains its canonical id field.
    allSources = {};
    Object.keys(data.sources || {}).forEach(function(k){
      var src = data.sources[k];
      if(!src) return;
      var sourceId = src.id || k;
      allSources[sourceId] = src;
    });
    allLocations = {};
    Object.keys(data.locations || {}).forEach(function(k){
      var loc = data.locations[k];
      if(!loc) return;
      var locationId = loc.id || k;
      allLocations[locationId] = loc;
    });
    allEvents = Array.isArray(data.events) ? data.events : [];
    allSourceObservations = Array.isArray(data.sourceObservations) ? data.sourceObservations : [];
    usingLiveDb = true;
    dbState = 'connected';
    setStatus(Object.keys(countries).length + ' countries on file');
    setDataAsOf('<span class="dot"></span> <b>Data as of ' + fmtGenerated(data.meta && data.meta.generated) + '</b>');
    // Global nuclear data is deliberately additive: it can expand TI beyond
    // the original country set without replacing the core live database.
    Promise.all([
      fetch('./data/nuclear_global.json', {cache:'no-store'}).then(function(res){
        if(!res.ok) throw new Error('Nuclear inventory HTTP ' + res.status);
        return res.json();
      }),
      fetch('./data/nuclear_country_profiles.json', {cache:'no-store'}).then(function(res){
        if(!res.ok) throw new Error('Nuclear profiles HTTP ' + res.status);
        return res.json();
      })
    ]).then(function(extra){
      var nuclear = extra[0] || {};
      var profiles = extra[1] || {};
      (profiles.profiles || []).forEach(function(p){
        var iso2 = String(p.iso2 || '').toLowerCase();
        if(!iso2) return;
        if(!countries[iso2]){
          countries[iso2] = {
            iso2: iso2,
            iso3: p.iso3 || '',
            name: p.name || iso2.toUpperCase(),
            officialName: p.name || iso2.toUpperCase(),
            status: 'ACTIVE',
            region: p.region || 'Other',
            subregion: p.subregion || '',
            notes: 'Nuclear/radiological country profile generated from the global TI nuclear infrastructure inventory.',
            nuclearFootprint: true,
            lastReviewed: p.lastRefreshed || null
          };
        } else {
          countries[iso2].nuclearFootprint = true;
          countries[iso2].nuclearProfile = p;
        }
      });
      (nuclear.countries || []).forEach(function(p){
        var iso2 = String(p.iso2 || '').toLowerCase();
        if(!iso2) return;
        if(!countries[iso2]){
          countries[iso2] = {
            iso2: iso2,
            iso3: p.iso3 || '',
            name: p.name || iso2.toUpperCase(),

            nuclearFootprint: true,
            lastReviewed: nuclear.generatedAt || null
          };
        } else {
          countries[iso2].nuclearFootprint = true;
        }
      });
      window.TI_NUCLEAR_GLOBAL = nuclear;
      setStatus(Object.keys(countries).length + ' countries on file');
      render();
    }).catch(function(err){
      console.warn('Global nuclear layer unavailable:', err);
      render();
    });
    refreshCurrentCountryData();
    render();
  }).catch(function(err){
    dbState = 'unavailable';
    setStatus(Object.keys(countries).length + ' countries (saved copy)');
    setDataAsOf('<span class="dot"></span> Could not load latest data — showing the saved copy', true);
    render();
  });

})();
